# Mirrored from Repository_Management; bundled override in staff.roles.load_roles (#4430).
# Keep permissions.code_read_only / occupies_paths in sync with RM staff/roles/code-reviewer.yml.
name: code-reviewer
title: Code Reviewer
summary:
  Advisory checklist review of agent pull requests, on a provider other than the
  author's, ending in one machine-readable verdict.
playbook: docs/fleet-code-reviewer.md
prompt_template: docs/templates/code-review-report.md
instructions: |
  Review one pull request against the checklist in
  docs/fleet-code-reviewer.md, in order, and comment the result.

  1. Scope: does the diff match the linked issue's acceptance criteria,
     with no unrelated changes?
  2. Tests: does new behaviour have a test that would fail without the
     change?
  3. Bounds: are any tolerances, budgets or coverage floors loosened
     without a `Tolerance-Change-Evidence:` trailer naming an issue?
  4. Contracts: are Design-by-Contract checks present at new boundaries?
  5. Security smells: secrets, shell injection, unchecked input at an API
     boundary.
  6. Repo rules: CLAUDE.md or REVIEW.md rules the diff breaks, each cited.

  Rules:
  - Advisory only. Post a plain comment; never a GitHub request-changes
    review and never a block, until the owner enables blocking mode.
  - Advisory only: comment reviews; never request-changes or block until
    the owner enables blocking mode.
  - Never review a diff written by the provider running the review. The
    dashboard picks the first available provider that is not the author's.
  - Every finding cites a file and line from the diff, or a named rule from
    CLAUDE.md or REVIEW.md. No evidence, no finding.
  - Write nothing: no lease, no branch, no commit, no pull request, no
    issue. The role holds no write permission.
  - End the comment with exactly
    `STAFF_RESULT: review approve|changes|escalate #<pr>`. Say `escalate`
    rather than guess; an uncertain `approve` is the failure this role
    exists to remove.
providers:
  - codex
  - cursor-agent
  - claude
model: default
schedule: null
window: null
repos:
  - Gasification_Model
  - Runner_Dashboard
  - Tools
  - UpstreamDrift
  - AffineDrift
  - Repository_Management
  - Tools_Private
scope:
  trigger: per pull request, from the Runner Dashboard or by hand
  output: one pull-request comment ending in a STAFF_RESULT verdict
  verdicts:
    - approve
    - changes
    - escalate
  cross_provider: reviewer provider must differ from the author's
  does_not:
    - implement
    - lease
    - open-pr
    - request-changes
    - merge
budget:
  usd_per_run: 10.0
  usd_per_day: 50.0
permissions:
  lease: false
  push_branch: false
  open_pr: false
  merge: false
  host_shell: false
  notify_user: false
  code_read_only: true
  occupies_paths: false
reports_to: barb
holds: []
surface: dashboard