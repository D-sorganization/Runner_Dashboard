# =============================================================================
# Runner Dashboard Pre-commit Configuration
# =============================================================================
# Fast checks on every commit (<15 seconds)
# Slower checks (mypy, diff-scoped pytest) on pre-push only; bandit and
# pip-audit run in CI Standard only (issue #1864)
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
# =============================================================================

repos:
  # Ruff - Fast Python linter with auto-fix
  # The rev MUST equal the ruff CI runs: pyproject [dependency-groups.dev]
  # `ruff==X` (resolved in uv.lock) and the ci-standard.yml fallback pin.
  # `files` MUST equal CI Standard's lint scope (`ruff check backend/
  # clients/`): linting paths CI never checks (scripts/, tests/, ...) made the
  # hooks reformat ~60 untouched files and blocked every rebased push.
  # Extensionless scripts are excluded too: ruff only discovers *.py/*.pyi.
  # Enforced by tests/test_precommit_ci_parity.py.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "ruff (Python lint + fix)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]
        files: ^(backend|clients)/.*\.pyi?$

      - id: ruff-format
        name: "ruff format (Python)"
        types: [python]
        files: ^(backend|clients)/.*\.pyi?$

  # Prettier - Format YAML, JSON, Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "prettier (yaml/json/md)"
        types_or: [yaml, markdown, json]
        exclude: '(package-lock\.json|\.ipynb|node_modules/)$'
        args: ["--write"]

  # ===========================================================================
  # QUALITY CHECKS
  # ===========================================================================

  - repo: local
    hooks:
      # Prevent wildcard imports (Python)
      - id: no-wildcard-imports
        name: "no wildcard imports (Python)"
        entry: "from .* import \\*"
        language: pygrep
        types: [python]
        exclude: ^(tests/|\.github/|frontend/|deploy/)

      # Per-PR change fragments (RM-5, Repository_Management#1894): a staged
      # changes/<issue>-<slug>.md must be valid. README.md is not a fragment.
      - id: changes-fragment
        name: "validate change fragments"
        entry: python scripts/changes_fragment.py validate
        language: system
        files: ^changes/[^/]+\.md$
        exclude: ^changes/README\.md$

      - id: no-duplicate-subprocess-env
        name: "no duplicate subprocess env scrubbers"
        entry: python scripts/find-dupe-subprocess-env.py
        language: system
        pass_filenames: false
        types: [python]

  # ===========================================================================
  # SECRET SCANNING (Issue #396)
  # ===========================================================================
  # Two complementary scanners:
  #   - gitleaks: regex + entropy on staged changes only (`protect --staged`;
  #     CI Secrets keeps the full-history scan), repo-tuned via
  #     `.gitleaks.toml`.
  #   - detect-secrets: heuristic scan against the audited `.secrets.baseline`;
  #     fails only on NEW findings outside the baseline.
  # Rotation procedure for the baseline lives in
  # `docs/runbooks/secret-scanning.md`.

  - repo: local
    hooks:
      - id: gitleaks
        name: "gitleaks (secret scan)"
        entry: gitleaks protect --staged --config .gitleaks.toml --no-banner --redact
        language: system
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    # v1.5.0 — pinned by SHA per repo policy.
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a
    hooks:
      - id: detect-secrets
        name: "detect-secrets (baseline diff)"
        # Wrapper keeps .secrets.baseline paths POSIX on Windows (upstream
        # rewrites them with backslashes and exits 3). Runs inside this
        # SHA-pinned hook env, so `python` resolves to its interpreter.
        entry: python scripts/detect_secrets_stable.py
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            package-lock\.json|
            uv\.lock|
            .*\.tsbuildinfo|
            \.secrets\.baseline
          )$

  # ===========================================================================
  # PRE-PUSH HOOKS (Slower - run before push only)
  # ===========================================================================

  # MyPy - Python type checking (pre-push only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "mypy (Python type check)"
        stages: [pre-push]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
          - fastapi
          - uvicorn
          # PyPI publishes psutil's stubs as ``types-psutil``; the old
          # guessed package name never resolved and broke pre-push.
          - types-psutil
        args: [--ignore-missing-imports]
        types: [python]
        files: ^backend/
        exclude: ^(frontend/|deploy/|docs/|backend/__init__\.py$)

  # Pytest - Python unit tests (pre-push only, diff-scoped, issue #1864)
  # Runs only the tests mapped from the changed files, via
  # scripts/run_pytest_diff.py (vendored from Repository_Management
  # shared_scripts/, RM#1891). A change with no mapped test runs nothing here;
  # CI Standard runs the suite. Bandit and other heavy scans run in CI only.
  - repo: local
    hooks:
      - id: pytest-unit
        name: "pytest (diff-scoped Python tests)"
        stages: [pre-push]
        entry: uv run python -m scripts.run_pytest_diff
        args:
          [
            "--pytest-args",
            "-x -q --tb=short -m 'not slow and not integration and not requires_posix'",
          ]
        # ``language: system`` runs pytest from the user's activated venv
        # (or PATH-resolved pytest). The previous config used
        # ``language: python`` with ``additional_dependencies: [pytest,
        # pytest-cov]``, which spun up an isolated venv with ONLY those
        # two packages — so any test that touched fastapi, pydantic,
        # identity, etc. errored at import on every push from any host.
        # Contract: contributors must have the project venv activated
        # (or run ``pip install -e ".[dev]"`` once) before pushing.
        language: system
        pass_filenames: false
        types: [python]

# =============================================================================
# Global Settings
# =============================================================================

default_language_version:
  python: python3.11
  node: "24.14.1"

exclude: |
  (?x)^(
    \.git/|
    __pycache__/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    node_modules/|
    \.venv/|
    venv/|
    build/|
    dist/|
    .*\.egg-info/
  )

fail_fast: false

ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: "main"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [pytest-unit, mypy]
