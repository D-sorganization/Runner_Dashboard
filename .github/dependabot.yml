# Golden target — Runner_Dashboard (RM#2196)
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore(deps)
      include: scope

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
      - judgement:objective
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
      - judgement:objective
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
      - judgement:objective
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
