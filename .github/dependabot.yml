# Golden target — Runner_Dashboard (RM#2196)
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    update-types:
      - minor
      - patch

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
      - judgement:objective
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
      - judgement:objective
    commit-message:
      prefix: chore(actions)
      include: scope
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
      - judgement:objective
    commit-message:
      prefix: chore(docker)
      include: scope
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
