name: Agent Redundant PR Closer

# Closes duplicate agent PRs that close the same issue (not ``Refs #N``). See
# shared_scripts/agent_identity.py::PRIORITY_ORDER. Missing token or closer errors
# exit non-zero. ``pull_request`` runs only while the PR is open.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect only, don't close"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      agent_filter:
        description: "Comma-separated agent ids whose PRs are eligible to close (default: all non-user)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: jules-redundant-pr-closer-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  close-redundant:
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.state == 'open')
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Close redundant agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          AGENT_FILTER: ${{ inputs.agent_filter }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is empty; cannot authenticate to GitHub API."
            exit 1
          fi
          args=(--repo "$REPO_NAME")
          [ "$DRY_RUN_INPUT" = "true" ] && args+=(--dry-run)
          [ -n "$AGENT_FILTER" ] && args+=(--agent-filter "$AGENT_FILTER")
          PYTHONPATH=".github/fleet-pr-cap:${PYTHONPATH:-}" python3 -m scripts.close_redundant_agent_prs "${args[@]}"
