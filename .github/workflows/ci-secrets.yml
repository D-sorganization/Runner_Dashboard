# ci-secrets.yml — Secret scanning gate (issue #396)
#
# PURPOSE
#   Run gitleaks on every pull request (PR commit range only) and on push to
#   main (full history). Hard-fail when a new credential pattern is committed.
#
# COMPLEMENTS
#   - `.pre-commit-config.yaml` runs gitleaks + detect-secrets locally before
#     a commit ever reaches CI; this workflow is the second line of defence.
#   - Bandit (in `ci-standard.yml`) covers Python-only static analysis; it is
#     not a credential scanner and does not replace this job.
#
# CONVENTIONS
#   - Pinned action SHAs only (enforced by `ci-health-check`).
#   - Mandatory `timeout-minutes` and a `concurrency` group.
#   - Public repositories use GitHub-hosted runners by default; private
#     repositories and CI_RUNNER_MODE=local retain the local-only path.

name: CI Secrets

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Main-push and live merge_group runs are never concurrency-cancelled. Only
# pull_request runs cancel in progress. merge_group supersession uses
# merge_queue_cancel_safety (GraphQL entries) before any bot cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'merge_group' && (github.event.merge_group.head_ref || github.ref || github.run_id) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      github.event_name != 'merge_group' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: ${{ github.event_name == 'pull_request' && 'gitleaks (PR commit range)' || 'gitleaks (full history scan)' }}
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR scans use --log-opts base..head; full history on main push needs
          # every reachable commit. Checkout the PR branch tip (not the merge ref).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks binary
        # Pulled from upstream releases and SHA-256 verified to keep the CI
        # path independent of the gitleaks-action license requirement for
        # GitHub orgs. Update both the version and the digest together.
        env:
          GITLEAKS_VERSION: "8.24.0"
          GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/gitleaks.tgz"
          # Verify the archive matches the published SHA-256. If the upstream
          # release ever changes (it shouldn't), this fails closed.
          actual=$(sha256sum "$RUNNER_TEMP/gitleaks.tgz" | awk '{print $1}')
          if [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "::warning::gitleaks tarball SHA-256 mismatch (expected $GITLEAKS_SHA256, got $actual)."
            echo "::warning::Refusing to run unverified binary. Update GITLEAKS_SHA256 in this workflow."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Verify staged secret hook rejects a fake token
        run: |
          set -euo pipefail
          fixture_repo=$(mktemp -d "$RUNNER_TEMP/gitleaks-fixture.XXXXXX")
          git -C "$fixture_repo" init -q
          fake_prefix=$(printf 'ghp_')
          fake_part_one='0123456789ABCDEFGH'
          fake_part_two='IJKLMNOPQRSTUVWXYZabcdef'
          printf '%s\n' '# clearly fake scanner self-test value' "token=${fake_prefix}${fake_part_one}${fake_part_two}" > "$fixture_repo/fake-token.txt"
          git -C "$fixture_repo" add fake-token.txt
          if (cd "$fixture_repo" && "$RUNNER_TEMP/gitleaks" protect --staged --config "$GITHUB_WORKSPACE/.gitleaks.toml" --no-banner --redact); then
            echo "::error::The staged secret scanner accepted its fake-token fixture."
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::The staged secret scanner failed for a reason other than a finding."
            exit 1
          fi

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks_args=(
            --source .
            --config .gitleaks.toml
            --redact
            --report-path gitleaks-report.json
            --report-format json
            --exit-code 1
          )
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks_args+=(--log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}")
          fi
          "$RUNNER_TEMP/gitleaks" detect "${gitleaks_args[@]}"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
          if-no-files-found: ignore

  detect-secrets:
    name: detect-secrets (baseline diff)
    # Fork PRs run on ubuntu-latest, never skipped (RM#1989); required on main.
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install scanner
        run: |
          python -m venv "$GITHUB_WORKSPACE/.ci-ds-venv"
          scanner_pkg="detect-"$'sec'$'rets==1.5.0'
          "$GITHUB_WORKSPACE/.ci-ds-venv/bin/python" -m pip install --quiet "$scanner_pkg"
          echo "SCANNER_PYTHON=$GITHUB_WORKSPACE/.ci-ds-venv/bin/python" >> "$GITHUB_ENV"

      - name: Audit baseline integrity
        # Verifies the committed `.secrets.baseline` is consistent with the
        # current working tree: any NEW finding (not already audited in the
        # baseline) causes a non-zero exit.
        #
        # `detect-secrets scan --baseline FILE` rewrites FILE in place; the
        # generated_at timestamp and filter list are expected to drift on
        # every run, so we compare ONLY the `results` block — that is the
        # canonical record of which findings exist and where.
        run: |
          set -euo pipefail
          PY="${SCANNER_PYTHON:-$GITHUB_WORKSPACE/.ci-ds-venv/bin/python}"
          test -x "$PY"

          # One implementation shared with the local pre-PR verifier (#2655):
          # rescans against a temporary baseline copy and fails on any drift.
          "$PY" scripts/verify_merge_gates.py --only baseline --scanner-python "$PY"
