# Weekly lockfile maintenance — Issue #163
name: Lockfile Upgrade
on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Supersede stale lockfile maintenance runs so the runner queue stays current.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.4.3
        with:
          version: "latest"

      - name: Upgrade Python lockfile
        run: uv lock --upgrade

      - name: Open PR with lockfile updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/weekly-lockfile-upgrade
          title: "chore: weekly dependency lockfile upgrade"
          body: |
            Automated weekly upgrade of `uv.lock` via `uv lock --upgrade`.

            - [ ] CI passes
            - [ ] `pip-audit` clean
            - [ ] `ruff check` clean
            - [ ] `mypy` clean
          commit-message: "chore: weekly lockfile upgrade"
          delete-branch: true
