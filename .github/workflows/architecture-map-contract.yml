name: Architecture Map Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Main-push / merge-group runs are never cancelled by a newer merge: a cancelled
# required check leaves that commit permanently non-green, so node auto-deploy and
# main-ci-auto-release would never find a releasable commit. Only superseded
# pull_request runs are cancelled. Contract: tests/test_main_push_concurrency.py
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-architecture-map:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Validate Architecture Map Contract
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate Architecture Map Contract
        run: |
          python scripts/architecture_map_contract.py --path docs/architecture/C4.md

      - name: Run Architecture Map Contract Tests
        # Self-hosted runners share a Python tool cache; pytest plugins other
        # repos installed there (e.g. an Xvfb launcher) hung this step past the
        # 5 min timeout on some runner slots. Load only the plugin we need.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install pytest pytest-asyncio pyyaml httpx
          python -m pytest -p pytest_asyncio.plugin tests/test_architecture_map_contract.py -v --noconftest
