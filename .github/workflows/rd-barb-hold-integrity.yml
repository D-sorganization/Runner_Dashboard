name: rd-barb Hold Integrity
on:
  pull_request:
    paths:
      - "backend/staff/rd_barb_*.py"
      - "backend/routers/staff_rd_barb.py"
      - "config/rd_barb_locked_policy.json"
      - "tests/**/test_rd_barb_*.py"
      - "staff/roles/rd-barb.yml"
      - "scripts/rd_barb_*.py"
      - ".github/workflows/rd-barb-hold-integrity.yml"
permissions:
  contents: read
concurrency:
  group: rd-barb-hold-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hold-integrity:
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv && uv sync --frozen
      - run: .venv/bin/python -m pytest -p no:cacheprovider tests/unit/test_rd_barb_hold_lint.py tests/unit/test_rd_barb_memory.py tests/api/test_rd_barb_guidelines_api.py
