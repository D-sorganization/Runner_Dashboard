# CI dispatch marker 2026-04-23
name: CI Standard
on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    # NOTE: no `paths`/`paths-ignore` filter here, deliberately. `quality-gate`
    # and `tests` are required status checks on main, so a PR that skips this
    # workflow never reports them and can never merge -- it sits BLOCKED with
    # zero failures and nothing pending. That is why `**.md` was already left
    # out of this filter; `LICENSE` and `.gitignore` were dropped for exactly
    # the same reason. `push` below still ignores them: post-merge CI does not
    # gate the required context. Enforced by tests/test_workflow_hygiene.py::
    # test_required_context_workflows_have_no_pull_request_path_filters.
  # Merge queue (Repository_Management#1890): `quality-gate` and `tests` must
  # report on the queue's merge commit. Non-PR events run full validation.
  merge_group:
  schedule:
    # Nightly bandit / pip-audit / security-scan (issue #2891); PRs run the same
    # steps in Python scope. merge_group omits heavy scanners.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_local:
        description: Force runner-routed jobs onto the local fleet
        required: false
        default: false
        type: boolean
      recovery_source_run_id:
        description: Source run ID that triggered cloud recovery
        required: false
        type: string

# Main-push and live merge_group runs are never concurrency-cancelled. Only
# pull_request runs cancel in progress. Obsolete merge_group runs self-cancel
# when their gh-readonly-queue ref is deleted (queue-entry-alive); bots use
# merge_queue_cancel_safety (GraphQL entries) before cancelling anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'merge_group' && (github.event.merge_group.head_ref || github.ref || github.run_id) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-guard:
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/reusable-pr-freshness-guard.yml

  pick-runner:
    name: Select reversible CI runner
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || (github.event_name == 'workflow_dispatch' && inputs.force_local) && 'd-sorg-fleet' || (!github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || (github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || 'd-sorg-fleet')) }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - id: detect-expedite
        name: Detect priority:expedite on this PR
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          label='priority:expedite'
          has=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "$PR_LABELS" | grep -q "\"name\": \"$label\"" && has=true || true
          elif [ "$EVENT_NAME" = "merge_group" ] && [ -n "$MERGE_HEAD_REF" ]; then
            pr=$(echo "$MERGE_HEAD_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')
            if [ -n "$pr" ]; then
              names=$(gh pr view "$pr" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null || true)
              echo "$names" | grep -qx "$label" && has=true || true
            fi
          fi
          echo "has_expedite=$has" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          sparse-checkout: .github/scripts/merge-queue-ref-guard.sh
          sparse-checkout-cone-mode: false
      - name: Stop obsolete merge queue entries
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-queue-ref-guard.sh
      - id: select
        name: Select runner without API polling
        shell: bash
        env:
          CONFIGURED_MODE: ${{ vars.CI_RUNNER_MODE }}
          CI_QUEUE_RUNNER_MODE: ${{ vars.CI_QUEUE_RUNNER_MODE }}
          CI_PR_RUNNER_MODE: ${{ vars.CI_PR_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          FORCE_LOCAL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_local }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_EXPEDITE: ${{ steps.detect-expedite.outputs.has_expedite }}
          FORK_PR: ${{ github.event.pull_request &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "mode=hosted" >> "$GITHUB_OUTPUT"
            echo "Fork PR - never routed to the self-hosted fleet (RM#1989)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$FORCE_LOCAL" = "true" ]; then
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "Forced local fleet via workflow_dispatch input" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_EXPEDITE" = "true" ] && { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; }; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "mode=hosted-expedite" >> "$GITHUB_OUTPUT"
            echo "priority:expedite — GitHub-hosted runners (escalation lane #2952)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$CI_QUEUE_RUNNER_MODE" = "hosted" ]; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "mode=hosted-queue" >> "$GITHUB_OUTPUT"
            echo "Merge queue on GitHub-hosted runners (CI_QUEUE_RUNNER_MODE=hosted)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$CI_PR_RUNNER_MODE" = "hosted" ]; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "mode=hosted-pr" >> "$GITHUB_OUTPUT"
            echo "PR checks on GitHub-hosted runners (CI_PR_RUNNER_MODE=hosted)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$REPOSITORY_PRIVATE" = "true" ] || [ "$CONFIGURED_MODE" = "local" ]; then
            echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "Private repo or CI_RUNNER_MODE=local — routed to d-sorg-fleet" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "mode=hosted" >> "$GITHUB_OUTPUT"
            echo "Public repo hosted runner (CI_RUNNER_MODE not local)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Event tier + docs-only fast path (issue #1864, RM#1915) ─────────────
  # Decides how much of this workflow an event needs:
  #   pull_request -> tier=pr: lint, format, type check, fast tests and heavy
  #                   security scans when the Python lane is in scope. The scope
  #                   detector below may skip the Python lane (docs-only path).
  #   merge_group  -> tier=merge-group: slim gate (issue #2891): lint, fast
  #                   tests and required aggregates only; heavy scans run on PR.
  #                   Never skipped: a queue group can mix several PRs.
  #   push (main)  -> tier=post-merge: no duplicate heavy jobs. Main only
  #                   moves through the merge queue with squash merges, so the
  #                   pushed tree is the one merge_group already validated.
  #                   ci-health-check (pins, line cap) still runs as a cheap
  #                   post-merge sanity check.
  #   anything else (workflow_dispatch, ...) -> tier=full (fail safe).
  # quality-gate and tests-required read these outputs and report on every
  # event; a failed `changes` job fails both (tests/test_workflow_hygiene.py).
  changes:
    name: Decide CI tier
    needs: [pick-runner]
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      full_suite: ${{ steps.tier.outputs.full_suite }}
      run_python_tests: ${{ steps.python-scope.outputs.run_python_tests || steps.tier.outputs.run_python_tests }}
    steps:
      - id: tier
        name: Select CI tier for this event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # run_python_tests comes from the python-scope step below.
              echo "tier=pr" >> "$GITHUB_OUTPUT"
              echo "full_suite=false" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "tier=merge-group" >> "$GITHUB_OUTPUT"
              echo "full_suite=false" >> "$GITHUB_OUTPUT"
              echo "run_python_tests=true" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "tier=post-merge" >> "$GITHUB_OUTPUT"
              echo "full_suite=false" >> "$GITHUB_OUTPUT"
              echo "run_python_tests=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tier=full" >> "$GITHUB_OUTPUT"
              echo "full_suite=true" >> "$GITHUB_OUTPUT"
              echo "run_python_tests=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "event=$EVENT_NAME"
      - name: Determine Python validation scope
        id: python-scope
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for py in python3.12 python3.11 python3 python; do
            if command -v "$py" >/dev/null 2>&1; then
              PYTHON_BIN="$py"
              break
            fi
          done
          if [ -z "${PYTHON_BIN:-}" ]; then
            echo "::error::No Python interpreter available for PR scope detection."
            exit 1
          fi

          "$PYTHON_BIN" - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              files = [item["filename"] for item in json.load(response)]

          # One page holds at most 100 files. A truncated listing is not proof
          # that the PR is docs-only, so fail closed and run the Python lane.
          truncated = len(files) >= 100

          # Keep in sync with the "Report skipped Python validation" step below
          # and with SCOPE_PREFIX_NOUNS in tests/test_ci_config.py. Every job
          # gated on run_python_tests (quality-gate — the sole required status
          # check — plus security-scan, tests, tests-required) is skipped when
          # this predicate is false, so a missing prefix means a PR merges with
          # no test signal at all.
          prefixes = ("backend/", "clients/", "deploy/", "tests/")
          exact = {
              "pyproject.toml",
              "uv.lock",
              "requirements.txt",
              "requirements-audit-ignore.txt",
              "bandit.yaml",
              ".pre-commit-config.yaml",
          }
          run_python = truncated or any(
              path.startswith(prefixes)
              or path in exact
              for path in files
          )
          print(f"run_python_tests={'true' if run_python else 'false'}")
          print(f"changed_file_count={len(files)}", file=sys.stderr)
          EOF
      - name: Report skipped Python validation
        if: github.event_name == 'pull_request' && steps.python-scope.outputs.run_python_tests != 'true'
        run: echo "Skipping Python dependency bootstrap and pytest collection; this PR does not touch backend, clients, deploy, tests, or Python dependency policy files."

  # â”€â”€ Fleet-wide CI health gate (issue #154) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ci-health-check:
    needs: [pick-runner, changes, pr-guard]
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty. Commit or .gitignore untracked files."
            git status --short
            exit 1
          fi
          echo "Working tree clean."
      - name: Verify GitHub Actions are pinned to SHA
        run: |
          UNPINNED=$(grep -rE "uses:\s+\S+/(v[0-9]+|main|latest)" .github/workflows/ || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Floating action versions found. Pin to SHA."
            echo "$UNPINNED"
            exit 1
          fi
          echo "All actions pinned."
      - name: verify-action-pin-uniformity
        run: |
          # Issue #390: every guarded action must resolve to a single SHA across
          # all workflows, and that SHA must carry one consistent `# vN` comment.
          fail=0
          for action in checkout setup-python setup-node github-script upload-artifact download-artifact create-github-app-token; do
            shas=$(grep -hE "uses:\s+actions/${action}@" .github/workflows/*.yml \
              | sed -E 's/.*@([0-9a-f]{40}).*/\1/' | sort -u)
            count=$(printf '%s\n' "$shas" | grep -c '^[0-9a-f]\{40\}$' || true)
            if [ "$count" -gt 1 ]; then
              echo "::error::Inconsistent SHA pinning for actions/${action}: ${shas}"
              fail=1
            fi
            comments=$(grep -hE "uses:\s+actions/${action}@" .github/workflows/*.yml \
              | sed -E 's/.*#\s*(v[^ ]+).*/\1/' | sort -u)
            ccount=$(printf '%s\n' "$comments" | grep -c '^v' || true)
            if [ "$ccount" -gt 1 ]; then
              echo "::error::actions/${action} has inconsistent version comments: ${comments}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All guarded actions pinned uniformly."
      - name: verify-tool-version-parity
        run: |
          # Issue #390: pyproject [dependency-groups.dev] must pin ruff/mypy
          # to the exact versions used by .pre-commit-config.yaml.
          ruff_pc=$(grep -A1 "astral-sh/ruff-pre-commit" .pre-commit-config.yaml | grep "rev:" | sed -E 's/.*rev:\s*v?//;s/\s.*//')
          mypy_pc=$(grep -A1 "pre-commit/mirrors-mypy" .pre-commit-config.yaml | grep "rev:" | sed -E 's/.*rev:\s*v?//;s/\s.*//')
          ruff_pp=$(grep -E '"ruff==' pyproject.toml | sed -E 's/.*ruff==([0-9A-Za-z.\-]+).*/\1/')
          mypy_pp=$(grep -E '"mypy==' pyproject.toml | sed -E 's/.*mypy==([0-9A-Za-z.\-]+).*/\1/')
          if [ "$ruff_pc" != "$ruff_pp" ] || [ -z "$ruff_pp" ]; then
            echo "::error::ruff version drift: pre-commit=$ruff_pc pyproject=$ruff_pp"
            exit 1
          fi
          if [ "$mypy_pc" != "$mypy_pp" ] || [ -z "$mypy_pp" ]; then
            echo "::error::mypy version drift: pre-commit=$mypy_pc pyproject=$mypy_pp"
            exit 1
          fi
          echo "ruff/mypy parity ok: ruff=$ruff_pc mypy=$mypy_pc"
      - name: Verify no source file exceeds 500 lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # RD-33: exact repo-relative paths, matched whole-line (grep -vxF).
          # The old unanchored regex let look-alikes slip through uncapped
          # (e.g. "queue.py" also matched backend/staff/board_queue.py;
          # "identity.py" also matched backend/tailnet_identity.py). Kept
          # inline (not an external file) so the list travels with the step
          # and can't go missing out from under it. Both branches below filter
          # the file list *before* counting lines, so there's no "total"
          # summary line to special-case either.
          EXEMPT_PATHS=$(cat <<'PATHS'
          backend/server.py
          backend/dispatch_contract.py
          backend/agent_dispatch_router.py
          backend/routers/credentials.py
          backend/security.py
          backend/routers/maxwell.py
          backend/routers/queue.py
          backend/routers/remediation.py
          backend/routers/diagnostics.py
          backend/gh_client.py
          backend/system_utils.py
          backend/runner_autoscaler.py
          backend/queue_cleanup.py
          backend/identity.py
          backend/machine_registry.py
          frontend/src/pages/Queue/index.tsx
          frontend/src/lib/api-types.ts
          frontend/src/shell/navRegistry.ts
          frontend/src/pages/Principals.tsx
          frontend/src/pages/Analysis.tsx
          frontend/src/pages/RemediationPRs.tsx
          frontend/src/pages/Machines.tsx
          frontend/src/pages/FleetTab.tsx
          frontend/src/pages/FleetOrchestration.tsx
          frontend/src/pages/FeatureRequests.tsx
          frontend/src/pages/RemediationTab.tsx
          frontend/src/pages/Workflows.tsx
          frontend/src/pages/RemediationIssues.tsx
          frontend/src/pages/Queue/__tests__/Mobile.test.tsx
          frontend/src/pages/StaffConsole/__tests__/Mobile.test.tsx
          frontend/src/pages/Fleet/__tests__/Mobile.test.tsx
          frontend/src/pages/Credentials/__tests__/Mobile.test.tsx
          frontend/src/pages/Remediation/__tests__/Mobile.test.tsx
          frontend/src/pages/Reports/__tests__/Mobile.test.tsx
          PATHS
          )
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fail CLOSED (RD#2730): a shallow checkout has no merge base, so
            # fetch the exact base commit and diff it against HEAD directly
            # (two-dot, no merge base needed). Any git failure aborts the step
            # under `set -e`; it must never degrade to an empty file list.
            if [ -z "${BASE_SHA:-}" ]; then
              echo "::error::pull_request event has no base SHA; cannot compute changed files."
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            CHANGED=$(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- backend/ frontend/src/)
            echo "Changed source paths vs base ${BASE_SHA}:"
            printf '%s\n' "$CHANGED"
            FILES=$(printf '%s\n' "$CHANGED" \
              | { grep -E '\.(py|ts|tsx|js)$' || true; } \
              | { grep -vxF -f <(printf '%s\n' "$EXEMPT_PATHS") || true; })
            if [ -z "$FILES" ]; then
              echo "No changed source files require line-cap enforcement."
              exit 0
            fi
            OVER=$(printf '%s\n' "$FILES" | xargs -r wc -l | grep -vE ' total$' | awk '$1 > 500 {print $1, $2}')
          else
            OVER=$(find backend/ frontend/src/ -type f \( -name "*.py" -o -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) \
              | { grep -vxF -f <(printf '%s\n' "$EXEMPT_PATHS") || true; } \
              | xargs -r wc -l | grep -vE ' total$' | awk '$1 > 500 {print $1, $2}')
          fi
          if [ -n "$OVER" ]; then
            echo "::error::Files exceeding 500-line soft cap found:"
            echo "$OVER"
            exit 1
          fi
          echo "All source files â‰¤ 500 lines."
      - name: Bootstrap environment
        if: needs.changes.outputs.run_python_tests == 'true'
        run: |
          for py in python3.11 python3.12 python3.10 python3 python; do
            if command -v "$py" &>/dev/null; then
              "$py" -m venv "$RUNNER_TEMP/health-venv"
              break
            fi
          done
          source "$RUNNER_TEMP/health-venv/bin/activate"
          pip install --upgrade pip
          pip install pytest==8.1.1
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen
            # Use the uv-managed venv
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          echo "$RUNNER_TEMP/health-venv/bin" >> "$GITHUB_PATH"
      - name: Fail-fast check â€” pytest can collect tests
        if: needs.changes.outputs.run_python_tests == 'true'
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          fi
          if [ -d tests/ ]; then
            pytest --co -q tests/ || { echo "::error::pytest --co failed"; exit 1; }
          else
            echo "No tests directory - skipping collect check"
          fi

  lint:
    needs: [pick-runner, changes, ci-health-check, pr-guard]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.outputs.run_python_tests == 'true' &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: CODEOWNERS validity
        run: |
          test -s .github/CODEOWNERS
          grep -E '@[A-Za-z0-9-]+(/[A-Za-z0-9-]+)?' .github/CODEOWNERS > /dev/null
      - name: Install dependencies with uv
        run: |
          python -m venv "$RUNNER_TEMP/ci-tools"
          source "$RUNNER_TEMP/ci-tools/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          else
            pip install ruff==0.14.10 mypy==1.13.0 bandit==1.7.7
            pip install -r requirements.txt
            echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"
          fi
      - name: Check Tool Version Consistency
        run: |
          echo "Validating tool versions match .pre-commit-config.yaml..."
          if ! grep -q "rev: v0.14.10" .pre-commit-config.yaml; then
            echo "::error::Ruff version mismatch between CI and pre-commit config"
            exit 1
          fi
          if ! grep -q "rev: v1.13.0" .pre-commit-config.yaml; then
            echo "::error::MyPy version mismatch between CI and pre-commit config"
            exit 1
          fi
          echo "All tool versions are consistent"
      - name: Lint
        run: ruff check backend/ clients/
      - name: Check Formatting
        run: ruff format --check backend/ clients/
      - name: Install type stubs
        run: pip install types-PyYAML types-requests
      - name: Type Check
        # disallow_untyped_defs is true globally (pyproject.toml). Per-module
        # relaxed overrides are a shrink-only ratchet (issue #950, tracking #161):
        # the count may go DOWN but a PR that ADDS a relaxed override fails CI.
        # MYPY_OVERRIDE_BASELINE is the current allowance; lower it as overrides
        # are removed. Target is 0.
        env:
          MYPY_OVERRIDE_BASELINE: "24"
        run: |
          OVERRIDE_COUNT=$(python - <<'EOF'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          overrides = data.get("tool", {}).get("mypy", {}).get("overrides", [])
          relaxed_count = 0
          for override in overrides:
              if override.get("disallow_untyped_defs") is False or override.get("strict_optional") is False:
                  modules = override.get("module", [])
                  relaxed_count += len(modules) if isinstance(modules, list) else 1
          print(relaxed_count)
          EOF
          )
          echo "::notice::mypy relaxed-override module count: ${OVERRIDE_COUNT} (baseline ${MYPY_OVERRIDE_BASELINE}, target 0; #161)"
          if [ "${OVERRIDE_COUNT}" -gt "${MYPY_OVERRIDE_BASELINE}" ]; then
            echo "::error::mypy relaxed-override count ${OVERRIDE_COUNT} exceeds baseline ${MYPY_OVERRIDE_BASELINE}." \
              "Type the new module instead of relaxing it, or justify and bump MYPY_OVERRIDE_BASELINE in ci-standard.yml."
            exit 1
          fi
          if [ "${OVERRIDE_COUNT}" -lt "${MYPY_OVERRIDE_BASELINE}" ]; then
            echo "::notice::Override count dropped below baseline — lower MYPY_OVERRIDE_BASELINE to ${OVERRIDE_COUNT} to lock in the win."
          fi
          mypy backend/ --ignore-missing-imports --exclude 'backend/__pycache__' --no-implicit-optional
          # Agent clients (#1228) are stdlib-only scripts, checked as their own module set.
          mypy clients/fleet/ --ignore-missing-imports --no-implicit-optional
      - name: Runner disk guard vendored manifest
        run: python scripts/check_runner_disk_guard_drift.py --manifest-only --repo-root .
      - name: Grok role bundle drift (fixture canary)
        if: needs.changes.outputs.run_python_tests == 'true'
        run: >
          python -m scripts.export_grok_role_bundles --check
          --roles-dir tests/fixtures/grok_role_sync/roles
      - name: Run bandit security scan
        # pull_request (in scope), schedule, or workflow_dispatch — not merge_group.
        if: >-
          github.event_name != 'merge_group' &&
          needs.changes.outputs.run_python_tests == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          needs.changes.outputs.full_suite == 'true') &&
          (github.event_name != 'pull_request' ||
          needs.pr-guard.result == 'skipped' ||
          needs.pr-guard.outputs.skip_heavy != 'true')
        # Blocking for HIGH severity (-lll = high severity, -i = low+ confidence).
        # MEDIUM findings are allow-listed in bandit.yaml with rationale per finding.
        # Exits non-zero on HIGH; MEDIUM/LOW are suppressed via config.
        run: |
          bandit -r backend/ clients/ -lll -i --exclude backend/__pycache__ \
            -c bandit.yaml \
            -f json -o bandit-report.json
        # HIGH severity causes exit 1 — bandit returns non-zero; do NOT add
        # continue-on-error here so the job fails on HIGH findings.

      - name: Upload bandit report
        if: >-
          always() &&
          github.event_name != 'merge_group' &&
          needs.changes.outputs.run_python_tests == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          needs.changes.outputs.full_suite == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify No Placeholders
        run: |
          if grep -rE "TODO|FIXME" backend/ --include="*.py"; then
            echo "::error::Placeholders found. Matches:"
            grep -rE "TODO|FIXME" backend/ --include="*.py"
            exit 1
          fi
      - name: Verify Documentation Freshness (issue #394)
        run: |
          # The frontend is now Vite + React + TypeScript. Block any
          # regression in CLAUDE.md / CONTRIBUTING.md to the old
          # "no build step / no JSX / no TypeScript" claims.
          if grep -iE 'no (build step|jsx|typescript)' CLAUDE.md CONTRIBUTING.md; then
            echo "::error::Forbidden legacy frontend phrasing reintroduced."
            echo "The frontend is Vite + React + TypeScript. Update the docs."
            exit 1
          fi
          echo "Documentation freshness check passed."
      - name: Security Audit (pip-audit)
        # pull_request (in scope), schedule, or workflow_dispatch — not merge_group.
        if: >-
          github.event_name != 'merge_group' &&
          needs.changes.outputs.run_python_tests == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          needs.changes.outputs.full_suite == 'true') &&
          (github.event_name != 'pull_request' ||
          needs.pr-guard.result == 'skipped' ||
          needs.pr-guard.outputs.skip_heavy != 'true')
        # Blocking for CRITICAL/HIGH CVEs.
        # Known LOW/MEDIUM CVEs are allow-listed in requirements-audit-ignore.txt
        # with rationale and expiry date per entry.
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          IGNORE_FLAGS=()
          if [ -f requirements-audit-ignore.txt ]; then
            # Each non-comment line is a PURL to ignore (e.g. pkg:pypi/foo@1.0.0)
            while IFS= read -r line; do
              [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
              PURL=$(echo "$line" | awk '{print $1}')
              IGNORE_FLAGS+=(--ignore-vuln "$PURL")
            done < requirements-audit-ignore.txt
          fi
          if [ -f uv.lock ]; then
            ./.venv/bin/python -m pip_audit --progress-spinner=off "${IGNORE_FLAGS[@]}"
          else
            python -m venv "$RUNNER_TEMP/pip-audit-venv"
            "$RUNNER_TEMP/pip-audit-venv/bin/pip" install --quiet pip-audit
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip_audit -r requirements.txt \
              --progress-spinner=off "${IGNORE_FLAGS[@]}"
          fi

  security-scan:
    needs: [pick-runner, changes, ci-health-check, pr-guard]
    # pull_request (in scope), schedule, or workflow_dispatch — not merge_group (#2891).
    if: >-
      always() &&
      !cancelled() &&
      github.event_name != 'merge_group' &&
      needs.changes.outputs.run_python_tests == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
      needs.changes.outputs.full_suite == 'true') &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Audit Python Dependencies
        env:
          PYTHONNOUSERSITE: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m venv "$RUNNER_TEMP/security-venv"
          AUDIT_PYTHON="$RUNNER_TEMP/security-venv/bin/python"
          "$AUDIT_PYTHON" -m pip install --upgrade pip setuptools wheel
          "$AUDIT_PYTHON" -m pip install --quiet --no-cache-dir pip-audit

          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is required for security-scan dependency audit."
            exit 1
          fi

          IGNORE_FLAGS=""
          if [ -f requirements-audit-ignore.txt ]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
              PURL=$(echo "$line" | awk '{print $1}')
              IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $PURL"
            done < requirements-audit-ignore.txt
          fi

          # shellcheck disable=SC2086
          "$AUDIT_PYTHON" -m pip_audit -r requirements.txt \
            --progress-spinner=off $IGNORE_FLAGS

  tests:
    needs:
      - changes
      - ci-health-check
      - lint
      - pick-runner
      - pr-guard
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.outputs.run_python_tests == 'true' &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    permissions:
      actions: write
      contents: read
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python:
          - "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      # Hosted CI cannot clone private Repository_Management (RM#1989 / public RD).
      # Pin vendored bytes in tests/contracts/runner_disk_guard_upstream.json; lint
      # and pytest enforce the manifest. Sibling-checkout byte tests run locally.
      - name: Runner disk guard vendored manifest
        run: python scripts/check_runner_disk_guard_drift.py --manifest-only --repo-root .
      - name: Bootstrap Python venv
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          source "$RUNNER_TEMP/ci-venv/bin/activate"
          pip install --upgrade pip setuptools wheel
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen --python "$RUNNER_TEMP/ci-venv/bin/python"
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          else
            source "$RUNNER_TEMP/ci-venv/bin/activate"
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Run Python tests
        env:
          PYTHONPATH: backend:.
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        # -n auto: pytest-xdist parallel workers (issue #401).
        # -m exclusion: integration / playwright tests run nightly only.
        # Full tier (merge_group): whole suite with coverage (issue #342); the
        # coverage floor is enforced there. PR tier: the fast subset without
        # coverage instrumentation (issue #1864).
        run: |
          python - <<'PY'
          import os
          import platform
          import sys

          expected = tuple(int(part) for part in os.environ["EXPECTED_PYTHON"].split("."))
          actual = tuple(sys.version_info[: len(expected)])
          print(
              f"Expected CPython {os.environ['EXPECTED_PYTHON']}; actual "
              f"{platform.python_implementation()} {platform.python_version()} ({sys.executable})"
          )
          if platform.python_implementation() != "CPython" or actual != expected:
              raise SystemExit("test interpreter does not match the declared Python matrix")
          PY
          if [ ! -d tests/ ]; then
            echo "No tests directory found - skipping"
            exit 0
          fi
          if [ "$FULL_SUITE" = "true" ]; then
            pip install pytest-cov==6.1.1 --quiet
            pytest tests/ --tb=short -n auto -m "not integration and not playwright" \
              --cov=backend --cov-report=xml --cov-report=term-missing
          else
            pytest tests/ --tb=short -n auto -m "not integration and not playwright and not slow"
          fi
      - name: Re-check merge queue entry during long tests
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-queue-ref-guard.sh
      - name: Upload coverage artifact
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: coverage
          path: |
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # Posts the required `tests` context. It must run even when the matrix
  # failed: without `if: always()` a red matrix *skips* this job, and GitHub
  # treats a skipped required check as passing (six PRs merged with
  # `tests (3.11)` red that way before 2026-09-15).
  tests-required:
    name: tests
    needs:
      - changes
      - ci-health-check
      - tests
      - pick-runner
      - pr-guard
    if: >-
      always() &&
      !cancelled() &&
      (needs.pr-guard.result == 'success' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.result == 'failure')
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Confirm Python test matrix
        shell: bash
        env:
          PR_GUARD_RESULT: ${{ needs.pr-guard.result }}
          GUARD_SKIP: ${{ needs.pr-guard.outputs.skip_heavy }}
          GUARD_REASON: ${{ needs.pr-guard.outputs.reason }}
          CHANGES: ${{ needs.changes.result }}
          TIER: ${{ needs.changes.outputs.tier }}
          HEALTH: ${{ needs.ci-health-check.result }}
          RUN_PYTHON_TESTS: ${{ needs.changes.outputs.run_python_tests }}
          TESTS: ${{ needs.tests.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$PR_GUARD_RESULT" = "skipped" ]; then
            echo "::notice::tests-required: pr-guard skipped on $GITHUB_EVENT_NAME"
          elif [ "$PR_GUARD_RESULT" = "success" ] && [ "$GUARD_SKIP" = "true" ]; then
            echo "::notice::tests-required skipped heavy CI ($GUARD_REASON)"
            exit 0
          fi
          pr_supersession_lane() { [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; }
          merge_queue_lane() { [ "${GITHUB_EVENT_NAME:-}" = "merge_group" ]; }
          pr_superseded_cancel() {
            [ "$1" = "cancelled" ] || return 1
            if merge_queue_lane; then
              echo "::error::$2 reported 'cancelled' on merge_group; cannot merge untested."
              return 0
            fi
            pr_supersession_lane || return 1
            if [ -z "${PR_HEAD_SHA:-}" ] || [ -z "${RUN_HEAD_SHA:-}" ]; then
              echo "::error::$2 cancelled but PR/run head sha is missing; cannot treat as superseded."
              return 0
            fi
            if [ "$(echo "$RUN_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" = "$(echo "$PR_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "::error::$2 cancelled on the current PR head; not superseded."
              return 0
            fi
            echo "::notice::$2 cancelled (superseded by a newer workflow run)."
            return 0
          }
          handle_cancelled_upstream() {
            pr_superseded_cancel "$1" "$2" || return 1
            if pr_supersession_lane; then
              exit 0
            fi
            exit 1
          }
          echo "changes: $CHANGES (tier=$TIER, run_python_tests=$RUN_PYTHON_TESTS)"
          echo "ci-health-check: $HEALTH"
          echo "tests: $TESTS"
          if merge_queue_lane && [ "$TESTS" != "success" ]; then
            echo "::error::Python test matrix reported '$TESTS' on merge_group; cannot merge untested."
            exit 1
          fi
          if handle_cancelled_upstream "$CHANGES" changes; then exit; fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes reported '$CHANGES'; cannot trust the tier decision."
            exit 1
          fi
          if handle_cancelled_upstream "$HEALTH" ci-health-check; then exit; fi
          if [ "$HEALTH" != "success" ]; then
            echo "::error::ci-health-check reported '$HEALTH'; cannot trust the Python scope decision."
            exit 1
          fi
          if [ "$RUN_PYTHON_TESTS" != "true" ] && [ "$TIER" != "full" ] && [ "$TESTS" = "skipped" ]; then
            if [ "$TIER" = "post-merge" ]; then
              echo "Push to main: the merge queue already ran the full suite on this tree."
            else
              echo "PR touches no Python surface; test matrix intentionally skipped."
            fi
            exit 0
          fi
          if handle_cancelled_upstream "$TESTS" tests; then exit; fi
          if [ "$TESTS" != "success" ]; then
            echo "::error::Python test matrix reported '$TESTS', expected 'success'."
            exit 1
          fi
          echo "Python test matrix passed."

  # Required branch-protection context for `main` (org ruleset
  # Repository_Protections requires exactly this name). Before 2026-09-15 this
  # name belonged to the lint job above, conditioned on the PR touching
  # Python - so when ci-health-check failed (empty outputs) or the PR was
  # frontend-only, the required check was *skipped*, which GitHub treats as
  # passing: 23 of the last 65 merges landed that way, some with
  # ci-health-check itself red.
  #
  # `if: always()` is load-bearing for the same reason.
  quality-gate:
    needs:
      [
        pick-runner,
        pr-guard,
        changes,
        ci-health-check,
        lint,
        tests-required,
        security-scan,
      ]
    if: >-
      always() &&
      !cancelled() &&
      (needs.pr-guard.result == 'success' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.result == 'failure')
    # Fork PRs run on a hosted runner, never the fleet (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Require every gated job to succeed
        shell: bash
        env:
          PR_GUARD_RESULT: ${{ needs.pr-guard.result }}
          GUARD_SKIP: ${{ needs.pr-guard.outputs.skip_heavy }}
          GUARD_REASON: ${{ needs.pr-guard.outputs.reason }}
          CHANGES: ${{ needs.changes.result }}
          TIER: ${{ needs.changes.outputs.tier }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          HEALTH: ${{ needs.ci-health-check.result }}
          RUN_PYTHON_TESTS: ${{ needs.changes.outputs.run_python_tests }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TESTS: ${{ needs.tests-required.result }}
          RESULT_SECURITY: ${{ needs.security-scan.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pr_supersession_lane() { [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; }
          merge_queue_lane() { [ "${GITHUB_EVENT_NAME:-}" = "merge_group" ]; }
          pr_superseded_cancel() {
            [ "$1" = "cancelled" ] || return 1
            if merge_queue_lane; then
              return 0
            fi
            pr_supersession_lane || return 1
            if [ -z "${PR_HEAD_SHA:-}" ] || [ -z "${RUN_HEAD_SHA:-}" ]; then
              return 0
            fi
            [ "$(echo "$RUN_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" != "$(echo "$PR_HEAD_SHA" | tr '[:upper:]' '[:lower:]')" ]
          }
          failed=0
          if [ "$PR_GUARD_RESULT" = "skipped" ]; then
            echo "::notice::quality-gate: pr-guard skipped on $GITHUB_EVENT_NAME"
          elif [ "$PR_GUARD_RESULT" = "success" ] && [ "$GUARD_SKIP" = "true" ]; then
            echo "::notice::quality-gate skipped heavy CI ($GUARD_REASON)"
            exit 0
          fi
          echo "changes: $CHANGES (tier=$TIER, full_suite=$FULL_SUITE, run_python_tests=$RUN_PYTHON_TESTS)"
          if [ "$CHANGES" = "cancelled" ] && pr_supersession_lane; then
            if pr_superseded_cancel cancelled changes; then
              echo "::notice::changes cancelled (superseded by a newer workflow run)."
              exit 0
            fi
            echo "::error::changes cancelled on the current PR head; not superseded."
            exit 1
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes reported '$CHANGES', expected 'success'."
            failed=1
          fi
          echo "ci-health-check: $HEALTH"
          if [ "$HEALTH" = "cancelled" ] && pr_supersession_lane; then
            if pr_superseded_cancel cancelled ci-health-check; then
              echo "::notice::ci-health-check cancelled (superseded by a newer workflow run)."
              exit 0
            fi
            echo "::error::ci-health-check cancelled on the current PR head; not superseded."
            exit 1
          fi
          if [ "$HEALTH" != "success" ]; then
            echo "::error::ci-health-check reported '$HEALTH', expected 'success'."
            failed=1
          fi
          for pair in "lint=$RESULT_LINT" "tests=$RESULT_TESTS" "security-scan=$RESULT_SECURITY"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            echo "$job: $result"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "cancelled" ] && pr_supersession_lane; then
              if pr_superseded_cancel cancelled "$job"; then
                echo "::notice::$job cancelled (superseded by a newer workflow run)."
                continue
              fi
              echo "::error::$job cancelled on the current PR head; not superseded."
              failed=1
              continue
            fi
            if merge_queue_lane; then
              if [ "$job" = "security-scan" ] && [ "$result" = "skipped" ]; then
                echo "::notice::security-scan not run on merge_group slim gate."
                continue
              fi
              echo "::error::$job reported '$result' on merge_group; cannot merge untested."
              failed=1
              continue
            fi
            # Nothing may skip in the full tier. Otherwise lint and
            # security-scan skip by design when the Python lane is off
            # (docs-only PR, post-merge push); tests-required always runs and
            # encodes that rule itself.
            if [ "$result" = "skipped" ] && [ "$TIER" != "full" ]; then
              if [ "$RUN_PYTHON_TESTS" != "true" ] && [ "$job" != "tests" ]; then
                echo "::notice::$job skipped: Python lane is off for tier '$TIER'."
                continue
              fi
            fi
            echo "::error::$job reported '$result', expected 'success'."
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::quality-gate: one or more gated jobs did not succeed."
            exit 1
          fi
          echo "quality-gate: all gated jobs succeeded."
