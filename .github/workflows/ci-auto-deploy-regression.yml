# Regression gate for node auto-deploy live bugs (#2083, #2108, #2111, #2114).
# Mandatory #2116 deploy smoke TDD rule: every PR modifying deploy/**, service units,
# release packaging, or auto-release workflows must first add a failing regression test case here (#2255).
name: Node auto-deploy regression

on:
  pull_request:
    paths:
      - "deploy/**"
      - "tests/deploy/**"
      - "tests/test_main_ci_release_wait.py"
      - "tests/test_deploy_smoke_tdd_rule.py"
      - ".github/workflows/ci-auto-deploy-regression.yml"
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "deploy/**"
      - "tests/deploy/**"
      - "tests/test_main_ci_release_wait.py"
      - "tests/test_deploy_smoke_tdd_rule.py"
      - ".github/workflows/ci-auto-deploy-regression.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Main-push and live merge_group runs are never concurrency-cancelled. Only
# pull_request runs cancel in progress. Obsolete merge_group runs self-cancel
# when their gh-readonly-queue ref is deleted (queue-entry-alive).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'merge_group' && (github.event.merge_group.head_ref || github.ref || github.run_id) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue-entry-alive:
    name: Merge queue ref guard
    if: >-
      github.event_name == 'merge_group' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: d-sorg-fleet
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Stop obsolete merge queue entries
        shell: bash
        env:
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-queue-ref-guard.sh

  pr-guard:
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/reusable-pr-freshness-guard.yml

  auto-deploy-regression:
    name: Auto-deploy live regression
    needs: [pr-guard]
    if: >-
      github.event_name != 'merge_group' &&
      always() &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    # Heavy job: stays self-hosted even once the repo is public (#3084); see
    # config/public_repo_heavy_jobs.json and docs/runner-labels.md.
    environment:
      name: ci-self-hosted-heavy-public
    runs-on: ${{ github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || 'd-sorg-fleet-public-heavy' }}
    timeout-minutes: 10
    steps:
      # Prior non-cone sparse checkouts on reused self-hosted runners can hide
      # tracked paths from a later full checkout (#3608, #3612).
      - name: Reset workspace (stale self-hosted checkout guard)
        run: rm -rf "${GITHUB_WORKSPACE:?}" && mkdir -p "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: |
            3.10
            3.12

      - name: Install test runner
        run: python3.12 -m pip install --quiet pytest-asyncio==1.3.0 PyYAML==6.0.3

      - name: Node auto-deploy and main release regression suite (#2116)
        env:
          BASH: bash
        run: >-
          python3.12 -m pytest --confcutdir=tests/deploy
          tests/deploy/test_auto_deploy_ci_regression.py
          tests/test_main_ci_release_wait.py
          tests/test_deploy_smoke_tdd_rule.py -q
