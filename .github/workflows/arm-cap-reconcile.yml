name: Armed PR cap reconcile

on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:
    inputs:
      trigger_disarm:
        description: "When over cap in enforce mode, dispatch conflict-disarm"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: arm-cap-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconcile armed inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          PYTHON_BIN=""
          for py in python3.12 python3.11; do
            if command -v "$py" >/dev/null 2>&1; then
              PYTHON_BIN="$py"
              break
            fi
          done
          if [ -z "$PYTHON_BIN" ]; then
            echo "::error::Armed PR cap reconcile requires Python 3.11+ (datetime.UTC)."
            exit 1
          fi
          args=("$PYTHON_BIN" scripts/arm_cap_reconcile.py --repo "${{ github.repository }}")
          if [ "${{ inputs.trigger_disarm || 'false' }}" = "true" ]; then
            args+=(--trigger-disarm)
          fi
          "${args[@]}"
