# Automatic GitHub release for green commits still on main and not older than the latest auto-release.
# Re-verifies the node auto-deploy CI gate, packages dashboard artifacts, and
# publishes an idempotent vYYYY.MM.DD-<shortsha> release with SHA-256 sidecar.
name: Main CI auto-release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to publish (default main HEAD)
        required: false
        type: string
  workflow_run:
    workflows:
      - CI Standard
      - Frontend Tests
    types: [completed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  # One fleet publish at a time; let the active run finish (busy main must not cancel mid-publish).
  group: main-ci-auto-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dashboard release when CI gate is green
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: d-sorg-fleet
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout release source at workflow_run head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve committer date for deterministic tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          COMMITTER_DATE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.committer.date')"
          echo "committer_date=${COMMITTER_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python (wheelhouse for artifact packaging)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js (frontend bundle in artifact)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Publish main CI release (gate, package, tag, retention)
        shell: bash
        env:
          COMMITTER_DATE: ${{ steps.meta.outputs.committer_date }}
          PROTECTED_RELEASE_SHAS: ${{ vars.AUTO_RELEASE_PROTECTED_SHAS }}
        run: |
          set -euo pipefail
          bash deploy/publish-main-ci-release.sh \
            --sha "${HEAD_SHA}" \
            --committer-date "${COMMITTER_DATE}" \
            --keep 30 \
            --protected-sha "${PROTECTED_RELEASE_SHAS}" \
            --require-main-ancestor

  publish-dispatch:
    name: Publish dashboard release (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: d-sorg-fleet
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Checkout release source at requested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve committer date for deterministic tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          COMMITTER_DATE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.committer.date')"
          echo "committer_date=${COMMITTER_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python (wheelhouse for artifact packaging)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js (frontend bundle in artifact)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Publish main CI release (gate, package, tag, retention)
        shell: bash
        env:
          COMMITTER_DATE: ${{ steps.meta.outputs.committer_date }}
          PROTECTED_RELEASE_SHAS: ${{ vars.AUTO_RELEASE_PROTECTED_SHAS }}
        run: |
          set -euo pipefail
          bash deploy/publish-main-ci-release.sh \
            --sha "${HEAD_SHA}" \
            --committer-date "${COMMITTER_DATE}" \
            --keep 30 \
            --protected-sha "${PROTECTED_RELEASE_SHAS}"
