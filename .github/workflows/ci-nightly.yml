name: CI Nightly (Integration)

# Runs the integration test suite that PR CI deliberately skips. See
# issue #401 for context: marker-based selection lets PR CI stay fast
# while still exercising network/external surfaces every 24 hours.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          else
            python -m venv "$RUNNER_TEMP/nightly-venv"
            . "$RUNNER_TEMP/nightly-venv/bin/activate"
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            echo "$RUNNER_TEMP/nightly-venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Run integration tests
        env:
          PYTHONPATH: backend
        # -n auto: pytest-xdist parallel workers.
        # -m integration: run only tests marked @pytest.mark.integration.
        # Fails (issue #3776) when tests/ is missing, nothing is selected
        # (pytest exit 5) or every selected case skips; records executed IDs.
        run: |
          if [ ! -d tests/ ]; then
            echo "::error::tests/ directory not found; nightly integration cannot run."
            exit 1
          fi
          pytest tests/ --tb=short -n auto -m integration --junitxml=nightly-junit.xml
      - name: Verify integration cases executed
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_junit_executed.py nightly-junit.xml

  ci-failure-alert:
    name: CI failure alert
    needs: [integration]
    if: always() && failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts/ci
            shared_scripts
            backend/andon
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: File Andon alert for red nightly CI
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci/workflow_failure_andon.py
