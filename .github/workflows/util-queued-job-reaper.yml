name: Queued Job Reaper

# Cancels superseded pull_request workflow runs and dequeued merge_group runs.
# merge_group cancellations call ``may_cancel_merge_group_run`` against live
# GraphQL ``mergeQueue.entries`` so live queue heads are never cancelled.
# Main-branch push runs are never cancelled.
#
# Disable: set repo variable QUEUED_JOB_REAPER_DISABLED=true, or disable this
# workflow in the Actions tab, or run workflow_dispatch with dry-run true.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Read-only: log what would be cancelled, don't cancel."
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      min-age-minutes:
        description: "Only consider runs at least this many minutes old."
        required: false
        default: "20"
        type: string
      max-cancel:
        description: "Cap cancellations per sweep."
        required: false
        default: "10"
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: queued-job-reaper
  cancel-in-progress: true

jobs:
  reap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read
    timeout-minutes: 13
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check kill switch
        id: kill-switch
        env:
          DISABLED_FLAG: ${{ vars.QUEUED_JOB_REAPER_DISABLED }}
        run: |
          if [ "${DISABLED_FLAG:-false}" = "true" ]; then
            echo "::notice::QUEUED_JOB_REAPER_DISABLED=true; exiting without action."
            {
              echo "## Queued Job Reaper"
              echo ""
              echo "- **Status:** disabled via repo variable QUEUED_JOB_REAPER_DISABLED=true"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "disabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap superseded workflow runs
        if: steps.kill-switch.outputs.disabled != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is empty; cannot authenticate to GitHub API."
            exit 1
          fi
          python3 scripts/reap_github_workflow_runs.py \
            --dry-run "${{ github.event_name == 'schedule' && 'false' || inputs.dry-run || 'true' }}" \
            --min-age-minutes "${{ inputs.min-age-minutes || '20' }}" \
            --max-cancel "${{ inputs.max-cancel || '10' }}"
