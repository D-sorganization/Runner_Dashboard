name: Frontend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Main-push and live merge_group runs are never concurrency-cancelled. Only
# pull_request runs cancel in progress. Obsolete merge_group runs self-cancel
# when their gh-readonly-queue ref is deleted (queue-entry-alive).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'merge_group' && (github.event.merge_group.head_ref || github.ref || github.run_id) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-guard:
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/reusable-pr-freshness-guard.yml

  frontend-required:
    name: frontend-required
    needs:
      [
        pr-guard,
        frontend-scope,
        typecheck,
        vitest,
        perf-budget,
        playwright-e2e,
        staff-console-e2e,
      ]
    if: >-
      always() &&
      !cancelled() &&
      (needs.pr-guard.result == 'success' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.result == 'failure')
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet' }}
    timeout-minutes: 5
    steps:
      - name: Require all applicable frontend checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          guard = needs.get("pr-guard", {})
          if guard.get("result") != "skipped" and guard.get("outputs", {}).get("skip_heavy") == "true":
              print("PR early-exit; frontend-required neutral")
              sys.exit(0)
          scope = needs["frontend-scope"]
          outputs = scope.get("outputs", {})
          flags = [outputs.get(key) for key in ("run_frontend_tests", "run_staff_e2e")]
          if scope["result"] != "success" or any(flag not in ("true", "false") for flag in flags):
              sys.exit("Frontend scope failed or did not report explicit scope decisions")
          frontend, staff = (flag == "true" for flag in flags)
          if os.environ.get("GITHUB_EVENT_NAME") == "merge_group":
              required = {
                  "typecheck": True,
                  "vitest": frontend,
                  "perf-budget": False,
                  "playwright-e2e": False,
                  "staff-console-e2e": False,
              }
          else:
              required = {
                  "typecheck": True,
                  "vitest": frontend,
                  "perf-budget": frontend,
                  "playwright-e2e": frontend,
                  "staff-console-e2e": staff,
              }
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          merge_group = event_name == "merge_group"
          failed = []
          for job, applicable in required.items():
              result = needs[job]["result"]
              if applicable:
                  if result != "success":
                      failed.append(f"{job}={result}")
              elif result not in {"success", "skipped"}:
                  failed.append(f"{job}={result}")
          if failed:
              sys.exit("Frontend checks did not succeed: " + ", ".join(failed))
          print("All applicable frontend checks succeeded")
          PY

  frontend-scope:
    needs: [pr-guard]
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      needs.pr-guard.result == 'skipped' ||
      needs.pr-guard.outputs.skip_heavy != 'true')
    # Fork PRs are routed to ubuntu-latest, never skipped (RM#1989).
    name: Determine frontend validation scope
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      run_frontend_tests: ${{ steps.scope.outputs.run_frontend_tests }}
      run_staff_e2e: ${{ steps.scope.outputs.run_staff_e2e }}
      run_api_contract: ${{ steps.scope.outputs.run_api_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          sparse-checkout: .github/scripts/merge-queue-ref-guard.sh
          sparse-checkout-cone-mode: false
      - name: Stop obsolete merge queue entries
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-queue-ref-guard.sh
      - name: Detect changed frontend surface
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            {
              echo "run_frontend_tests=true"
              echo "run_staff_e2e=false"
              echo "run_api_contract=true"
            } >> "$GITHUB_OUTPUT"
            echo "merge_group: slim frontend gate (tsc + Vitest only)."
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "run_frontend_tests=true"
              echo "run_staff_e2e=true"
              echo "run_api_contract=true"
            } >> "$GITHUB_OUTPUT"
            echo "Non-PR event: full frontend validation required."
            exit 0
          fi

          for py in python3.12 python3.11 python3 python; do
            if command -v "$py" >/dev/null 2>&1; then
              PYTHON_BIN="$py"
              break
            fi
          done
          if [ -z "${PYTHON_BIN:-}" ]; then
            echo "::error::No Python interpreter available for PR scope detection."
            exit 1
          fi

          "$PYTHON_BIN" - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              files = [item["filename"] for item in json.load(response)]

          exact = {
              "package.json",
              "package-lock.json",
              "vite.config.ts",
              "vitest.config.ts",
              "tsconfig.json",
              "tsconfig.app.json",
              "tsconfig.node.json",
          }
          run_frontend = any(path.startswith(("frontend/", "scripts/")) or path in exact for path in files)
          print(f"run_frontend_tests={'true' if run_frontend else 'false'}")
          staff_prefixes = ("frontend/src/pages/Staff", "backend/staff/", "backend/routers/staff", "tests/e2e/")
          run_staff = run_frontend or any(path.startswith(staff_prefixes) for path in files)
          print(f"run_staff_e2e={'true' if run_staff else 'false'}")
          # Backend routes and models change the generated OpenAPI snapshot (#1819).
          run_api_contract = run_frontend or any(path.startswith("backend/") for path in files)
          print(f"run_api_contract={'true' if run_api_contract else 'false'}")
          print(f"changed_file_count={len(files)}", file=sys.stderr)
          EOF

  typecheck:
    name: TypeScript typecheck (tsc)
    needs: frontend-scope
    # Required on main: never skip the job — gate heavy steps so the context
    # always reports (docs-only PRs and merge_group included).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - name: Note when TypeScript validation is out of scope
        if: needs.frontend-scope.outputs.run_api_contract != 'true'
        run: |
          echo "Change set does not touch the API contract / TypeScript surface; heavy steps skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.frontend-scope.outputs.run_api_contract == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        run: npm ci

      - name: Install backend dependencies for API contract generation
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/api-contract-venv"
          source "$RUNNER_TEMP/api-contract-venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          else
            pip install -r requirements.txt
            echo "$RUNNER_TEMP/api-contract-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify generated API contract types
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        run: npm run generate-api:check

      - name: Typecheck (tsc, no emit)
        if: needs.frontend-scope.outputs.run_api_contract == 'true'
        run: npm run typecheck

  vitest:
    name: Vitest + Coverage
    needs: frontend-scope
    # Fork PRs are routed to ubuntu-latest, never skipped (RM#1989).
    if: >-
      (needs.frontend-scope.outputs.run_frontend_tests == 'true')
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: ts-nocheck ratchet
        run: bash scripts/check_ts_nocheck.sh

      - name: Run frontend tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  perf-budget:
    name: Frontend perf budget (real bundle)
    needs: frontend-scope
    # Fork PRs are routed to ubuntu-latest, never skipped (RM#1989).
    if: >-
      github.event_name != 'merge_group' &&
      (needs.frontend-scope.outputs.run_frontend_tests == 'true')
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.CI_PR_RUNNER_MODE == 'hosted' && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # Enforce perf-budget.json against the REAL Vite-built JS bundle (issue
      # #831): the entry chunk must stay small now that the legacy App is
      # lazy-loaded and code-split out of first paint, and every non-vendor
      # async chunk must stay within the per-chunk budget. Reverting the lazy
      # boundary folds the monolith back into the entry and fails here.
      - name: Enforce real-bundle perf budget
        run: python scripts/check_frontend_perf_budget.py --bundle --json

  playwright-e2e:
    name: Playwright E2E smoke tests
    # Heavy job: stays self-hosted even once the repo is public (#3084); see
    # config/public_repo_heavy_jobs.json and docs/runner-labels.md.
    environment:
      name: ci-self-hosted-heavy-public
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet-public-heavy' }}
    timeout-minutes: 20
    needs:
      - frontend-scope
      - vitest
    # Fork PRs are routed to ubuntu-latest, never skipped (RM#1989).
    if: >-
      github.event_name != 'merge_group' &&
      (needs.frontend-scope.outputs.run_frontend_tests == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: bash scripts/ci_install_playwright_browsers.sh chromium

      - name: Set up Python for backend
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m venv "$RUNNER_TEMP/backend-venv"
          source "$RUNNER_TEMP/backend-venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          if [ -f uv.lock ]; then
            rm -rf .venv
            pip install uv
            uv sync --frozen
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          else
            pip install -r requirements.txt
            echo "$RUNNER_TEMP/backend-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Allocate dashboard test port
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(f"DASHBOARD_PORT={sock.getsockname()[1]}")
          PY

      - name: Start dashboard backend
        run: |
          # Hermetic launcher: isolated HOME/config, no fleet derivation, temp
          # leader lock, 90s readiness budget, backend log tail on failure (#2943).
          python scripts/start_e2e_backend.py             --port "$DASHBOARD_PORT"             --root "$RUNNER_TEMP/e2e-backend"             --pid-file "$RUNNER_TEMP/dashboard-backend.pid"

      - name: Run Playwright e2e smoke tests
        run: |
          DASHBOARD_URL="http://localhost:5173" \
          VITE_BACKEND_URL="http://127.0.0.1:${DASHBOARD_PORT}" \
          npm run test:e2e -- --project=chromium-desktop

      - name: Stop dashboard backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dashboard-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/dashboard-backend.pid")" || true
          fi

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  staff-console-e2e:
    # Staff Console flows against the real backend with fake provider CLIs (#1341).
    name: Staff Console e2e (fake providers)
    # Heavy job: stays self-hosted even once the repo is public (#3084); see
    # config/public_repo_heavy_jobs.json and docs/runner-labels.md.
    environment:
      name: ci-self-hosted-heavy-public
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || github.event_name == 'merge_group' && vars.CI_QUEUE_RUNNER_LABEL || vars.CI_BROWSER_RUNNER_LABEL || 'd-sorg-fleet-public-heavy' }}
    timeout-minutes: 20
    needs: frontend-scope
    # Fork PRs are routed to ubuntu-latest, never skipped (RM#1989).
    if: >-
      github.event_name != 'merge_group' &&
      (needs.frontend-scope.outputs.run_staff_e2e == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: bash scripts/ci_install_playwright_browsers.sh chromium

      - name: Install backend dependencies
        run: |
          python -m venv "$RUNNER_TEMP/staff-e2e-venv"
          "$RUNNER_TEMP/staff-e2e-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/staff-e2e-venv/bin/python" -m pip install -r requirements.txt
          echo "STAFF_E2E_PYTHON=$RUNNER_TEMP/staff-e2e-venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify Staff E2E port allocation
        run: python -m unittest discover -s tests/e2e/staff -p 'test_port_allocator.py'

      - name: Allocate Staff E2E ports
        run: python tests/e2e/staff/port_allocator.py

      - name: Run Staff Console e2e suite
        run: npx playwright test -c tests/e2e/staff/playwright.config.ts

      - name: Upload Staff Console e2e results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: staff-console-e2e-results
          path: test-results/
          retention-days: 7
