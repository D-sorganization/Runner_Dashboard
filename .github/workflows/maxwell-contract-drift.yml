name: Maxwell Contract Drift

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Compare Maxwell OpenAPI snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/check_maxwell_contract_drift.py
          --issue-repo "${{ github.repository }}"
