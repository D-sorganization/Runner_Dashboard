name: Local-Only Workflow Runner Guard

# Enforces that unapproved workflows route their jobs to the d-sorg self-hosted
# fleet. The guard uses the reversible public-CI selector so a deliberate local
# drain cannot deadlock the check that governs hosted-runner exceptions.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-only-runner-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reject-hosted-runner-routing:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Reject hosted runner routing
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Verify workflow runner routing
        run: python -m scripts.local_only_runner_guard
