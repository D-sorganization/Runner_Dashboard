name: Collate Change Fragments

# RM-5 (Repository_Management#1894): every pull request adds its own changes/<issue>-<slug>.md
# instead of editing SPEC.md, DEVELOPMENT_LOG.md and HANDOFF.md, so open PRs
# never conflict over those files. This workflow folds every fragment present
# on main into the shared files with `scripts/changes_fragment.py collate`: one
# SPEC.md change-log row keyed by the PR that added the fragment, the DL-#<issue>
# entry updated in place, and the fragment deleted.
#
# It never pushes to main (the branch ruleset rejects that): it proposes the
# result on the reused branch bot/collate-changes and arms auto-merge through
# scripts/automerge_guard.py (vendored from Repository_Management).
#
# Adapted from Repository_Management .github/workflows/collate-changes.yml
# (commit 1cfc3466cffd753e22ebd48bc964bff7ed153dfa): RD action pins, scripts/
# paths for the vendored modules, Python 3.11.
#
