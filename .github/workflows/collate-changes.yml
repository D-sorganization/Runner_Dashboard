on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collate-changes.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collate-changes
  cancel-in-progress: false

jobs:
  collate:
    name: Collate merged change fragments
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Skip when no change fragments are pending
        id: pending-fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          COUNT=0
          for FRAGMENT in changes/*.md; do
            case "$(basename "$FRAGMENT")" in [Rr][Ee][Aa][Dd][Mm][Ee].md) continue ;; esac
            COUNT=$((COUNT + 1))
          done
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "OUTCOME=no pending change fragments on main" >> "$GITHUB_ENV"
            {
              echo "## Collate Change Fragments"
              echo ""
              echo "- **Fragments pending:** 0"
              echo "- **Outcome:** no pending change fragments on main"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Preflight Jules app credentials
        if: steps.pending-fragments.outputs.count != '0'
        id: credential-preflight
        env:
          JULES_APP_CLIENT_ID: ${{ secrets.JULES_APP_ID }}
          JULES_APP_PRIVATE_KEY: ${{ secrets.JULES_APP_PRIVATE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: | # pragma: allowlist secret
          missing=0
          if [ -z "$JULES_APP_CLIENT_ID" ]; then
            echo "::warning title=Missing GitHub App credential::JULES_APP_ID is not configured."
            missing=1
          fi
          if [ -z "$JULES_APP_PRIVATE_KEY" ]; then
            echo "::warning title=Missing GitHub App credential::JULES_APP_PRIVATE_KEY is not configured."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "credentials-present=false" >> "$GITHUB_OUTPUT"
            echo "OUTCOME=skipped; missing JULES_APP_ID / JULES_APP_PRIVATE_KEY" >> "$GITHUB_ENV"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Configure JULES_APP_ID and JULES_APP_PRIVATE_KEY before manually running this workflow."
              exit 1
            fi
            exit 0
          fi
          echo "credentials-present=true" >> "$GITHUB_OUTPUT"

      - name: Generate fleet app token
        if: steps.credential-preflight.outputs.credentials-present == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.JULES_APP_ID }}
          private-key: ${{ secrets.JULES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential-preflight.outputs.credentials-present == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Full history: each fragment's PR is read from the commit that
          # added it, which may be older than the push that triggered us.
          fetch-depth: 0

      - name: Set up Python
        if: steps.credential-preflight.outputs.credentials-present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"

      - name: Collate fragments
        if: steps.credential-preflight.outputs.credentials-present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/changes_fragment.py ]; then
            echo "OUTCOME=changes_fragment.py not on main yet; nothing to do" >> "$GITHUB_ENV"
            exit 0
          fi
          shopt -s nullglob
          COLLATED=0
          SKIPPED=0
          for FRAGMENT in changes/*.md; do
            case "$(basename "$FRAGMENT")" in [Rr][Ee][Aa][Dd][Mm][Ee].md) continue ;; esac
            SHA=$(git log -1 --diff-filter=A --format=%H -- "$FRAGMENT")
            PR=$(gh api "repos/$REPO_SLUG/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)
            if [ -z "$PR" ]; then
              PR=$(git log -1 --format=%s "$SHA" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9' || true)
            fi
            if [ -z "$PR" ]; then
              echo "::warning::No merged PR found for $FRAGMENT (added in $SHA); left in place."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            set +e
            COLLATE_OUT=$(python scripts/changes_fragment.py collate \
              --pr "$PR" --sha "$SHA" "$FRAGMENT" 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "::warning::$COLLATE_OUT"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            printf '%s\n' "$COLLATE_OUT"
            COLLATED=$((COLLATED + 1))
          done
          echo "COLLATED=$COLLATED" >> "$GITHUB_ENV"
          echo "SKIPPED_FRAGMENTS=$SKIPPED" >> "$GITHUB_ENV"

      - name: Propose collation as a pull request
        if: steps.credential-preflight.outputs.credentials-present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/collate-changes
          REPO_SLUG: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "OUTCOME=${OUTCOME:-no fragments collated (all skipped or unchanged)}" >> "$GITHUB_ENV"
            exit 0
          fi
          OWNER="${REPO_SLUG%%/*}"
          PR_NUM=$(gh api "repos/$REPO_SLUG/pulls?state=open&head=$OWNER:$BRANCH" --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ] && ! python3 scripts/automerge_guard.py "$REPO_SLUG" "$PR_NUM"; then
            echo "::warning::Collation PR #$PR_NUM is held by a reviewer; leaving it untouched."
            echo "OUTCOME=collation PR #$PR_NUM held; not updated" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(changes): collate ${COLLATED} change fragment(s)"
          git push --force origin "$BRANCH"
          if [ -z "$PR_NUM" ]; then
            PR_BODY="$(printf 'Generated by collate-changes.yml (RM-5, Repository_Management#1894): folds merged changes/ fragments into the SPEC.md change log and the development log, then deletes them. Generated content only.\n\nThe deleted files are the collated change fragments.\nDeletions-Acknowledged: true\n')"
            PR_NUM=$(gh api "repos/$REPO_SLUG/pulls" -X POST \
              -f title="chore(changes): collate merged change fragments" \
              -f head="$BRANCH" -f base=main \
              -f body="$PR_BODY" \
              --jq '.number')
          fi
          if python3 scripts/automerge_guard.py "$REPO_SLUG" "$PR_NUM" --arm --strategy squash; then
            echo "OUTCOME=collation PR #$PR_NUM, auto-merge armed" >> "$GITHUB_ENV"
          else
            echo "::warning::Auto-merge withheld on PR #$PR_NUM"
            echo "OUTCOME=collation PR #$PR_NUM, auto-merge withheld" >> "$GITHUB_ENV"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Collate Change Fragments"
            echo ""
            echo "- **Fragments collated:** ${COLLATED:-0}"
            echo "- **Fragments skipped:** ${SKIPPED_FRAGMENTS:-0}"
            echo "- **Outcome:** ${OUTCOME:-not reached}"
          } >> "$GITHUB_STEP_SUMMARY"
