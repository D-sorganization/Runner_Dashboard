# docker-build.yml — Build the runner-dashboard Docker image and run Trivy security scan.
# Triggered on every PR and push to main that touches relevant files.
name: Docker Build & Trivy Scan

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.lock.txt
      - requirements.txt
      - backend/**
      - frontend/**
      - config/**
  pull_request:
    paths:
      - Dockerfile
      - requirements.lock.txt
      - requirements.txt
      - backend/**
      - frontend/**
      - config/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-scan:
    runs-on: [self-hosted, Linux, X64, d-sorg-fleet-docker]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # v3.10.0

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: runner-dashboard:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=runner-dashboard-docker
          cache-to: type=gha,mode=max,scope=runner-dashboard-docker

      - name: Run Trivy vulnerability scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: runner-dashboard:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy scan results (SARIF)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: runner-dashboard:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Stage SARIF for hosted publication
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.0
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 1
        continue-on-error: true

  publish-sarif:
    name: Publish Trivy SARIF
    needs: docker-build-scan
    if: always() && needs.docker-build-scan.result != 'cancelled'
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - name: Download Trivy SARIF
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: steps.download.outcome == 'success'
        uses: github/codeql-action/upload-sarif@e4262713b504983e61c7728f5452be240d9385a7 # v3.26.1
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
