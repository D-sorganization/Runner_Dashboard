# docker-build.yml — Build the runner-dashboard Docker image and run Trivy security scan.
# PRs run only when Docker-relevant paths change; merge_group always builds.
name: Docker Build & Trivy Scan

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.lock.txt
      - requirements.txt
      - backend/**
      - frontend/**
      - config/**
      - docker/**
      - .github/workflows/docker-build.yml
  pull_request:
    # No workflow-level path filter: a skipped workflow never reports
    # `docker-build-scan`, which leaves optional branch rules stuck pending.
  merge_group:
  workflow_dispatch:

# Main-push / merge-group runs are never cancelled by a newer merge: a cancelled
# required check leaves that commit permanently non-green, so node auto-deploy and
# main-ci-auto-release would never find a releasable commit. Only superseded
# pull_request runs are cancelled. Contract: tests/test_main_push_concurrency.py
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide-docker-scope:
    name: Decide Docker validation scope
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 5
    outputs:
      run_docker: ${{ steps.scope.outputs.run_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/docker_pr_scope.py
            scripts/__init__.py
          sparse-checkout-cone-mode: false

      - id: scope
        name: Select Docker build scope for this event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              ;;
            *)
              echo "run_docker=true" >> "$GITHUB_OUTPUT"
              echo "event=$EVENT_NAME: full Docker validation"
              exit 0
              ;;
          esac

          for py in python3.12 python3.11 python3 python; do
            if command -v "$py" >/dev/null 2>&1; then
              PYTHON_BIN="$py"
              break
            fi
          done
          if [ -z "${PYTHON_BIN:-}" ]; then
            echo "::error::No Python interpreter available for Docker scope detection."
            exit 1
          fi

          PYTHONPATH="${GITHUB_WORKSPACE:-.}" "$PYTHON_BIN" -m scripts.docker_pr_scope >> "$GITHUB_OUTPUT"
      - name: Report skipped Docker validation
        if: steps.scope.outputs.run_docker != 'true'
        run: >-
          echo "Skipping Docker image build; this PR does not touch Dockerfile,
          docker/, backend/, frontend/, config/, or Python lockfiles."

  docker-image:
    name: Build and scan image
    env:
      BUILDX_BUILDER: rd-ci-${{ github.run_id }}-${{ github.run_attempt }}
    needs: decide-docker-scope
    if: >-
      needs.decide-docker-scope.outputs.run_docker == 'true' &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    # Public repo: GitHub-hosted ubuntu-latest (free, has Docker). The 4-runner
    # self-hosted docker pool starves the blocking deploy check (#2577).
    # Private repo or CI_RUNNER_MODE=local: the self-hosted Docker-capable pool.
    runs-on: ${{ fromJSON(!github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","d-sorg-fleet-docker"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate Docker configuration for this job
        id: docker-config
        run: |
          config_dir="${RUNNER_TEMP}/rd-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$config_dir"
          printf 'DOCKER_CONFIG=%s\n' "$config_dir" >> "$GITHUB_ENV"

      - name: Recover stale ephemeral buildx state
        run: bash scripts/ci/docker_buildx_recover.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # v3.10.0
        with:
          name: ${{ env.BUILDX_BUILDER }}

      - name: Build Docker image
        id: build
        env:
          BUILD_ATTEMPTS: "3"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="runner-dashboard:ci-${GITHUB_SHA}"
          attempt=1
          max="${BUILD_ATTEMPTS}"
          while [ "$attempt" -le "$max" ]; do
            echo "::group::Docker build attempt ${attempt}/${max}"
            if docker buildx build \
              --file Dockerfile \
              --tag "$tag" \
              --load \
              --cache-from "type=gha,scope=runner-dashboard-docker" \
              --cache-to "type=gha,mode=max,scope=runner-dashboard-docker" \
              .; then
              echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Docker build attempt ${attempt} failed; recovering buildx before retry"
            bash scripts/ci/docker_buildx_recover.sh --recreate
            if [ "$attempt" -eq "$max" ]; then
              echo "::error::Docker build failed after ${max} attempts"
              exit 1
            fi
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

      - name: Run Trivy vulnerability scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: runner-dashboard:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy scan results (SARIF)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: runner-dashboard:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Stage SARIF for hosted publication
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.0
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 1
        continue-on-error: true

  docker-build-scan:
    name: docker-build-scan
    needs:
      - decide-docker-scope
      - docker-image
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      always() &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 5
    steps:
      - name: Confirm Docker image gate
        shell: bash
        env:
          DECIDE: ${{ needs.decide-docker-scope.result }}
          RUN_DOCKER: ${{ needs.decide-docker-scope.outputs.run_docker }}
          IMAGE: ${{ needs.docker-image.result }}
        run: |
          echo "decide-docker-scope: $DECIDE (run_docker=$RUN_DOCKER)"
          echo "docker-image: $IMAGE"
          if [ "$DECIDE" != "success" ]; then
            echo "::error::decide-docker-scope reported '$DECIDE'; cannot trust the scope decision."
            exit 1
          fi
          if [ "$RUN_DOCKER" != "true" ]; then
            echo "PR touches no Docker surface; image build intentionally skipped."
            exit 0
          fi
          if [ "$IMAGE" = "cancelled" ]; then
            echo "::notice::docker-image was cancelled (concurrency overlap); another workflow run may satisfy the gate."
            exit 0
          fi
          if [ "$IMAGE" != "success" ]; then
            echo "::error::Docker image build and scan reported '$IMAGE', expected 'success'."
            exit 1
          fi
          echo "Docker image build and Trivy scan passed."

  publish-sarif:
    name: Publish Trivy SARIF
    needs:
      - decide-docker-scope
      - docker-image
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.decide-docker-scope.outputs.run_docker == 'true' &&
      (always() && needs.docker-image.result != 'cancelled')
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 10
    steps:
      - name: Download Trivy SARIF
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: steps.download.outcome == 'success'
        uses: github/codeql-action/upload-sarif@e4262713b504983e61c7728f5452be240d9385a7 # v3.26.1
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
