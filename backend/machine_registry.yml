version: 1
updated_at: 2026-09-01
machines:
  - name: ControlTower
    aliases:
      - controltower
      - control-tower-runner-monitoring
    display_name: ControlTower
    role: hub
    dashboard_url: http://controltower.tail2bbcc7.ts.net:8321
    tailscale_nodes:
      - name: control-tower-runner-monitoring
        ip: 100.95.177.68
        transport: wsl2
        preferred: false
      - name: controltower
        ip: 100.69.12.6
        transport: windows
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
    runner_pools:
      - name: ControlTower-NVMe
        aliases:
          - controltower-nvme
          - control-tower-nvme
          - controltower-fast
        dashboard_url: http://controltower.tail2bbcc7.ts.net:8321
        storage_tier: nvme
        runner_base_dir: /home/dieterolson/actions-runners-nvme
        # RETIRED 2026-07-31 (Runner_Dashboard issue #1071). Quarantined in
        # July after broad filesystem corruption (null-byte binaries, corrupt
        # dpkg/node/uv); retired rather than reprovisioned because the pool
        # was no longer NVMe-backed at all -- its vhdx sat on the same F:
        # SATA volume as the SSD pool, so a rebuild would have added disk
        # contention rather than an I/O tier, and ControlTower-SSD was
        # expanded 8 -> 17 runners to replace it.
        #
        # Both distros were unregistered after byte-verified backups:
        #   ControlTower-NVMe -> F:\WSL-backups\...-20260731.tar (sha256 recorded)
        #   legacy "WSL" hub  -> DeskComputer D:\WSL-backups\controltower\
        #                        (sha256 57B850DA...8191F3, matched both sides)
        # Reversal for either: wsl --import from the corresponding archive.
        #
        # Probable root cause of the original corruption: F: reached zero free
        # space while a distro was writing. It nearly recurred on the LIVE SSD
        # pool on 2026-07-31 (2.05 GB free, falling); the fleet monitor now
        # alarms on host disk floors. Do NOT co-locate large backups with a
        # live runner vhdx.
        runner_labels:
          - self-hosted
          - Linux
          - X64
          - d-sorg-quarantine
        retired: true
        retired_on: 2026-07-31
        runners:
          min: 0
          default: 0
          max: 0
        storage:
          # Distro unregistered; no vhdx remains on the host.
          host_drive: null
          windows_host_path: null
          wsl_distro: null
          vhdx_path: null
          disk_bus: null
          disk_media_type: null
          cache_budget_gb: 0
      - name: ControlTower-Runner
        aliases:
          - controltower-runner
          - control-tower-runner
        # 2026-09-01: the active ControlTower pool. Rebuilt as a fresh distro
        # after the ControlTower-SSD distro's vhdx went corrupt on 2026-08-24
        # (0x80070570 at mount; Repository_Management#1453 tracks recovery of
        # the retained vhdx). This instance IS the fleet hub
        # (MACHINE_ROLE=hub, dashboard on canonical port 8321). Runner names
        # are d-sorg-local-ControlTower-1..4 (no -SSD suffix). Docker engine
        # installed in-distro 2026-09-01 (docker.io 29.1.3 + buildx +
        # compose-v2) and all four runners carry d-sorg-fleet-docker so the
        # docker pool no longer depends on a single DeskComputer runner.
        # Capacity is scheduler-managed: 07:00-22:00 America/Los_Angeles
        # targets fewer runners for interactive headroom; nights/overnight
        # run default_count. Seeing the surplus units cleanly stopped
        # ("no retry needed") during the day is intended, not a failure.
        dashboard_url: http://controltower.tail2bbcc7.ts.net:8321
        storage_tier: ssd
        runner_base_dir: /home/dieterolson/actions-runners
        runner_labels:
          - self-hosted
          - Linux
          - X64
          - d-sorg-fleet
          - d-sorg-fleet-ssd
          - d-sorg-fleet-fast-io
          - d-sorg-fleet-docker
          - d-sorg-fleet-4core
          - d-sorg-fleet-bulk
        runners:
          min: 2
          default: 4
          max: 4
        storage:
          # Runner-backing volume: capacity gates measure THIS volume, not C:.
          # NOTE: the corrupt ControlTower-SSD vhdx (342 GB, retained on the
          # SAME F: volume pending Repository_Management#1453) is dead weight
          # against this pool's disk floor — F: filling to zero is exactly
          # what corrupted the previous pools. Resolve #1453 before F: gets
          # tight.
          runner_backing_drive: "F:"
          host_drive: "F:"
          windows_host_path: "F:\\WSL\\ControlTower-Runner"
          wsl_distro: ControlTower-Runner
          vhdx_path: "F:\\WSL\\ControlTower-Runner\\ext4.vhdx"
          disk_bus: SATA
          disk_media_type: SSD
          cache_budget_gb: 360
    storage:
      runner_backing_drive: "F:"
      host_drive: "F:"
    hardware:
      cpu_model: null
      cpu_physical_cores: null
      cpu_logical_cores: null
      memory_gb: null
      disk_total_gb: null
      gpu_vram_gb: null
      accelerators: []
      workload_tags:
        - hub
        - control-plane
        - fast-io
        - parallel-ci
    maintenance:
      owner: fleet-ops
      allow_auto_stop: false
      preferred_window: Saturdays 10:00-12:00 UTC
      notes: >
        ControlTower-Runner (4 runners, d-sorg-local-ControlTower-1..4) is
        the only active ControlTower Linux pool as of 2026-09-01; it
        replaced the ControlTower-SSD distro whose vhdx went corrupt on
        2026-08-24 (Repository_Management#1453; the 342 GB vhdx is retained
        on F: pending a recovery decision, and the 8 offline
        d-sorg-local-ControlTower-SSD-1..8 GitHub registrations are ghosts
        of that pool). The hub dashboard runs INSIDE the ControlTower-Runner
        distro on canonical port 8321. Docker engine lives in-distro since
        2026-09-01; the pool carries d-sorg-fleet-docker. The Windows-side
        matlab-1 runner is separate and active (scheduled task
        `matlab-runner`, logon-triggered with hourly repetition). The
        retired NVMe and D: HDD pools remain out of the active registry.
  - name: OGLaptop
    aliases:
      - og-laptop
      - oglaptop
    display_name: OGLaptop
    role: node
    dashboard_url: http://oglaptop.tail2bbcc7.ts.net:8321
    tailscale_nodes:
      - name: oglaptop
        ip: 100.125.64.108
        transport: wsl2
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
      - d-sorg-fleet-docker
    runners:
      default: 4
      max: 8
    storage:
      # Runner-backing volume: the one holding the WSL distro and every _work
      # directory. Capacity gates measure THIS volume, not the system drive.
      # On OGLaptop they happen to be the same disk; on DeskComputer they are
      # not, which is why the volume must be recorded per host rather than
      # assumed to be C:.
      runner_backing_drive: "C:"
      host_drive: "C:"
      windows_host_path: "C:\\Users\\diete\\AppData\\Local\\wsl"
      wsl_distro: Ubuntu
      vhdx_path: null # GUID-named directory under the path above
      disk_bus: null
      disk_media_type: null
      cache_budget_gb: null
    hardware:
      cpu_model: Intel Core i7-10750H
      cpu_physical_cores: 10
      cpu_logical_cores: 20
      memory_gb: 31
      disk_total_gb: 1007
      disk_windows_host_gb: 804
      gpu_vram_gb: null
      accelerators: []
      workload_tags:
        - parallel-ci
        - node
    maintenance:
      owner: fleet-ops
      allow_auto_stop: true
      preferred_window: Sundays 12:00-16:00 UTC
      notes: >
        WSL2 Ubuntu on Windows laptop. 10-core/20-thread CPU.
        Default 4 runners, auto-scalable to 8; all 8 online as of 2026-08-16.
        Disk pressure resolved: C: measured 194.8 GB free (20.5%) on
        2026-08-16, not the ~96% used recorded previously. Unlike the other
        hosts, OGLaptop's WSL distro really does live on C:, so C: IS the
        runner-backing volume here. Network caveat: OGLaptop sits on a separate
        192.168.12.0/24 segment reached over carrier-grade NAT (~96 ms), while
        ControlTower and DeskComputer share 192.168.4.0/24 (~46 ms direct) —
        prefer the other hosts for bandwidth-heavy jobs until that link is
        upgraded. Runner labels use d-sorg-fleet-4core.
  - name: DeskComputer
    aliases:
      - deskcomputer
      - desktop
      - Desktop
      - desk-computer
    display_name: DeskComputer
    role: node
    dashboard_url: http://deskcomputer.tail2bbcc7.ts.net:8321
    tailscale_nodes:
      - name: deskcomputer
        ip: 100.122.254.109
        transport: windows
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
      - d-sorg-fleet-docker
    runners:
      min: 6
      default: 8
      max: 8
    storage:
      # Runner-backing volume is D:, NOT the system drive. The WSL distro and
      # every runner _work directory live on the external D: drive; jobs never
      # write to C:. Capacity gates must measure D:.
      #
      # 2026-08-16: gating on C: throttled this host for weeks over space its
      # runners never touch — C: sat at 12.3% while D: had 592 GB free. C: was
      # also where an agent mistakenly relocated the distro; that orphaned copy
      # (147 GB) has been unregistered and the distro is correctly on D:.
      runner_backing_drive: "D:"
      host_drive: "D:"
      windows_host_path: "D:\\WSL"
      wsl_distro: Ubuntu-22.04
      vhdx_path: "D:\\WSL\\ext4.vhdx"
      disk_bus: USB
      disk_media_type: external
      cache_budget_gb: null
    hardware:
      cpu_model: null
      cpu_physical_cores: null
      cpu_logical_cores: null
      memory_gb: 54
      disk_total_gb: 1007
      gpu_vram_gb: null
      accelerators: []
      workload_tags:
        - parallel-ci
        - node
    maintenance:
      owner: fleet-ops
      allow_auto_stop: true
      preferred_window: Daily 05:00-07:00 America/Los_Angeles
      notes: >
        HP Envy laptop running WSL2 Ubuntu. Canonical machine name is
        DeskComputer; desktop is retained only as a legacy alias for older
        runner names. The WSL distro lives on the external D: drive — do not
        gate capacity on C:.
