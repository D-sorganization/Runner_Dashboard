# Shipped example topology — live fleet values belong in
# ~/.config/runner-dashboard/machine_registry.yml (see machine_registry.example.yml).
version: 1
updated_at: 2026-10-24
machines:
  - name: hub-a
    aliases:
      - hub-a
      - fleet-hub
    display_name: hub-a
    role: hub
    dashboard_url: http://hub-a.fleet-example.ts.net:8321
    tailscale_nodes:
      - name: hub-a
        ip: 100.64.254.13
        transport: windows
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
    runners:
      min: 2
      default: 4
      max: 8
    maintenance:
      owner: fleet-ops
      allow_auto_stop: true
  - name: node-a
    aliases:
      - node-a
    display_name: node-a
    role: node
    dashboard_url: http://node-a.fleet-example.ts.net:8321
    tailscale_nodes:
      - name: node-a
        ip: 100.64.254.10
        transport: wsl2
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
    maintenance:
      owner: fleet-ops
      allow_auto_stop: false
  - name: node-b
    aliases:
      - node-b
    display_name: node-b
    role: node
    dashboard_url: http://node-b.fleet-example.ts.net:8321
    tailscale_nodes:
      - name: node-b
        ip: 100.64.254.12
        transport: wsl2
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
    maintenance:
      owner: fleet-ops
      allow_auto_stop: true
  - name: node-c
    aliases:
      - node-c
    display_name: node-c
    role: node
    dashboard_url: http://node-c.fleet-example.ts.net:8321
    tailscale_nodes:
      - name: node-c
        ip: 100.64.254.14
        transport: linux
        preferred: true
    runner_labels:
      - self-hosted
      - Linux
      - X64
      - d-sorg-fleet
    runners:
      min: 0
      default: 0
      max: 0
    maintenance:
      owner: fleet-ops
      allow_auto_stop: true
