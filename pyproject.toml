[project]
name = "runner-dashboard"
version = "4.10.0"
description = "Runner dashboard for fleet management"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.136.1",
    "pydantic==2.13.3",
    "uvicorn[standard]==0.46.0",
    "psutil==7.2.2",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.14.0",
    "PyYAML==6.0.3",
    "anthropic==0.97.0",
    "requests==2.33.1",
    "itsdangerous==2.2.0",
    "prometheus-client==0.21.1",
    "starlette==1.3.1",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.6.0",
    "pytest-rerunfailures>=14.0",
    "respx>=0.21.1",
    # ruff/mypy are pinned exactly to match `.pre-commit-config.yaml` so
    # `uv sync` cannot install a newer linter than CI uses (issue #390).
    "ruff==0.14.10",
    "mypy==1.13.0",
    "bandit==1.7.7",
    "pip-audit>=2.10.0",
    "types-PyYAML",
    "types-requests",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-xdist==3.6.1",
    "pytest-rerunfailures==14.0",
    "respx==0.21.1",
]

[tool.uv]
package = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --durations=20 -m \"not slow and not live_simulation and not e2e and not requires_network and not heavy\""
markers = [
    "unit: Pure logic, highly isolated, execution in < 100ms",
    "integration: Subsystem boundaries, DBs, I/O, heavy mocking",
    "e2e: Full system boot, real networks, user workflows",
    "slow: marks tests as slow",
    "live_simulation: marks tests as requiring live simulation environment",
    "requires_network: needs real outbound network",
    "heavy: resource-intensive tests",
]

[tool.coverage.report]
# Phase 4 step 2 (EPIC #1140): raise fail_under 55 -> 60.
# Applications tier target: 75%.
fail_under = 60

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["frontend/", "deploy/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts intentionally use print() for stdout output.
"scripts/*.py" = ["T201", "T203"]
# Tests may use print() for diagnostic output during development.
"tests/*.py" = ["T201", "T203"]
# Client tests import shared pytest fixtures explicitly (a second conftest.py shadows tests/conftest.py).
"tests/clients/*.py" = ["F401", "F811"]
# Assessment and scratch scripts use print() for output
"assessments/*.py" = ["T201"]
"scratch/*.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Global default: all new modules must have full type annotations.
# Pre-existing large backend files carry per-module overrides below (tracked for
# removal in #161). The CI step prints the override count to prevent growth.
disallow_untyped_defs = true
strict_optional = true
# The backend runs with backend/ on sys.path, so its modules import each other as
# ``staff.x`` / ``routers.y``. Resolving them the same way here lets mypy check
# calls across modules; without it every such import was Any (#1734).
mypy_path = "backend"
explicit_package_bases = true
exclude = ['^backend/__init__\.py$', '^backend/wheels/', '__pycache__/']

[[tool.mypy.overrides]]
# Strict checking for small, well-typed contract modules (already compliant).
module = ["dispatch_contract", "remote_execution_contract"]
disallow_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
# Pre-existing godfiles: relax untyped-defs and strict_optional until #161.
# Each release this list should shrink. Do NOT add new modules here.
# Module paths are the names the backend imports them by (``server``, ``routers.auth``),
# matching ``mypy_path = "backend"`` above.
module = [
    "server",
    "agent_remediation",
    "workflow_stats",
    "usage_monitoring",
    "runner_autoscaler",
    "machine_registry",
    "deployment_drift",
    "report_files",
    "scheduled_workflows",
    "local_app_monitoring",
    "health",
    "identity",
    "lease_synchronizer",
    "metrics",
    "proxy_utils",
    "queue_cleanup",
    "quota_enforcement",
    "runner_lease",
    "routers.admin",
    "routers.auth",
    "routers.dispatch",
    "routers.fleet",
    "routers.runs_workflows",
    "routers.system",
]
disallow_untyped_defs = false
strict_optional = false
