# One rest-server auth user (and private restic repo name) per backup client.
# Usernames must match rest-server --private-repos layout under RESTIC_REST_DATA_DIR.
# Credential material lives only on hosts (see docs/runbooks/fleet-restic-backup.md).
version: 1
hub:
  machine: DeskComputer
  tailscale_only: true
  rest_url_pattern: "rest:http://<deskcomputer-tailscale-host>:8000/<rest_repo_user>"
clients:
  - machine: OGLaptop
    rest_repo_user: oglaptop
  - machine: ControlTower
    rest_repo_user: controltower
  - machine: Brick
    rest_repo_user: brick
