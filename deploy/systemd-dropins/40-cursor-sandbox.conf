# Drop-in: let cursor-agent's command sandbox run under runner-dashboard (issue #1698).
# Since #1586 cursor-agent runs with --sandbox enabled and confines the commands it
# runs with bubblewrap + Landlock + seccomp. This matches deploy/runner-dashboard.service;
# it exists for nodes whose installed unit predates #1698 (update-deployed.sh installs it).
#   /etc/systemd/system/runner-dashboard.service.d/40-cursor-sandbox.conf
# Then run: sudo systemctl daemon-reload
[Service]
RestrictNamespaces=
RestrictNamespaces=user mnt net ipc uts
SystemCallFilter=@mount landlock_create_ruleset landlock_add_rule landlock_restrict_self seccomp
