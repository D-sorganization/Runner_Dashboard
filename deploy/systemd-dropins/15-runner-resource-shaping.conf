# Opt-in per-runner resource shaping (Runner_Dashboard#4312).
# Installed only when config/resource-shaping-trial.json has "enabled": true
# via deploy/configure-runner-resource-shaping.sh.
#
# Soft weights only — CPUQuota and MemoryMax are intentionally excluded (#4306).
[Service]
Slice=runners.slice
CPUWeight=20
IOWeight=20
Nice=10