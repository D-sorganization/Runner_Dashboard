# systemd-tmpfiles config — recreate the runner-busy lockfile directory.
#
# Root cause this fixes (Runner_Dashboard#640): `/run` is a tmpfs and is wiped
# on every reboot / WSL restart. The install-time `install -d /run/runner-busy`
# in install-runner-maintenance.sh therefore does NOT survive a restart, and
# the job-started hook runs as the (non-root) runner user, which cannot
# `mkdir` under root-owned `/run`. The result is that the directory is missing
# after every boot, the JOB_STARTED hook silently fails to write its sentinel,
# and the lockfile busy-signal (Strategy 2 in backend/autoscaler_busy.py and
# deploy/runner-cleanup.sh) is dead — letting the cleanup pass / autoscaler
# stop a runner mid-job.
#
# systemd-tmpfiles runs this as root on every boot (and on
# `systemd-tmpfiles --create`), so the directory is recreated group-writable
# by the runner user before any job starts.
#
# install-runner-maintenance.sh substitutes __RUNNER_USER__ with the runner
# user and installs the result to /etc/tmpfiles.d/runner-busy.conf.
#
# Type Path             Mode  UID            GID            Age Argument
d      /run/runner-busy 0775  __RUNNER_USER__ __RUNNER_USER__ -
