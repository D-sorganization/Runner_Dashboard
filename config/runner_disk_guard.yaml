# Runner disk-guard thresholds for autoscaler cordon (RM-OPS-017 / #2221).
#
# Consumer: Runner_Dashboard runner-autoscaler (RD-OPS-017 / #2030).
# Validator: scripts/validate_runner_disk_guard.py
# Epic: Repository_Management #2215 (ci-throughput Phase 0).
#
# Trip: stop accepting new jobs when free space or usage crosses the trip
# thresholds. Drain running jobs up to drain.timeout_seconds, then set
# MIN_ONLINE to cordon.min_online_after_drain and run cleanup.commands.
# Re-admit only after headroom exceeds the readmit thresholds (hysteresis).

version: 1
schema: runner-disk-guard/v1
updated_at: "2026-10-21"

thresholds:
  # Aligns with AUTOSCALER_DISK_MIN_FREE_GB / ResourceThreshold.DISK_MIN_FREE_GB.
  trip_min_free_gb: 25.0
  # Hysteresis: require more headroom before taking the host out of cordon.
  readmit_min_free_gb: 40.0
  # Percent of root/data filesystem used (matches DISK_CRITICAL_PERCENT default).
  trip_used_percent: 92.0
  # Must stay below trip_used_percent (matches DISK_WARN_PERCENT default).
  readmit_used_percent: 85.0

drain:
  # Let in-flight GitHub Actions jobs finish before stopping runner units.
  timeout_seconds: 7200
  finish_running_jobs: true

cordon:
  min_online_after_drain: 0
  stop_accepting_jobs_on_trip: true

cleanup:
  commands:
    - argv: ["/usr/local/bin/runner-cleanup", "--disk-guard"]
      description: Allow-listed /tmp litter GC under disk pressure (RD#1155)
    - argv: ["/usr/local/bin/runner-cleanup"]
      description: Work-dir, tool-cache, and docker prune after cordon drain

alerts:
  cordoned_hosts_warning_threshold: 2
